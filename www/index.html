<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mercadinho da Esquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/jogo.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13"/><path d="M12 8C10 4 6.5 4.5 7 7c.3 1 2 1 5 1zM12 8c2-4 5.5-3.5 5-1-.3 1-2 1-5 1z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 18V6"/><path d="M6.5 11.5 12 6l5.5 5.5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-grow" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M12 17v-6"/><path d="M9.5 13.5 12 11l2.5 2.5"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 12.5l2 2 4-4"/><path d="M9 17.5h6"/></symbol>
  <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="15" r="6"/><path d="M8 3l2.5 6M16 3l-2.5 6"/><path d="M12 12.3l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17.2v.1"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></symbol>
</svg>

<canvas id="c" role="img" aria-label="Cenário do mercado. Para usar sem tocar no cenário, abra a Lista de construções e serviços (botão Lista ou tecla L). Arraste, pinça, roda do mouse, setas e os botões + e − movem e aproximam a visão."></canvas>

<div id="ui">
  <header id="hud">
    <div class="hud-row">
      <button class="chip lvl" id="lvlChip"><span class="badge-ic" aria-hidden="true"><svg class="i fill"><use href="#i-star"/></svg></span><span class="sr-only">Porte da loja: </span><b id="lvlNum">Nv 1</b></button>
      <div class="chip money" id="moneyChip"><span class="badge-ic" aria-hidden="true">M</span><span class="sr-only">Dinheiro: Mumbuca </span><b id="money">0</b></div>
      <button class="chip rep" id="repChip" aria-haspopup="dialog"><svg class="i fill" aria-hidden="true"><use href="#i-star"/></svg><span class="sr-only">Reputação: </span><b id="repNum">3,0</b><span class="sr-only"> estrelas. Toque para ver o motivo e como melhorar</span></button>
      <div class="spacer"></div>
      <button class="round" id="btnSettings" aria-label="Configurações"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <div class="hud-row2">
      <button id="progress">
        <div class="ptop"><span id="tierName">Mercadinho de Bairro</span><span id="pNext"></span></div>
        <div class="pbar"><i id="pFill"></i><span id="pTxt"></span></div>
      </button>
      <button class="round gift" id="btnRewards" aria-label="Recompensas"><svg class="i"><use href="#i-gift"/></svg><span class="badge" id="rewardBadge" hidden>0</span></button>
    </div>
    <div class="hud-row3"><div class="pill" id="dayline">Dia 1</div><div class="pill" id="billsPill"></div></div>
  </header>

  <div id="side">
    <button class="side-btn" id="btnLista" aria-pressed="false" aria-label="Lista de construções e serviços"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span aria-hidden="true">Lista</span></button>
    <button class="side-btn" id="btnMap" aria-pressed="false" aria-label="Ver a loja inteira"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg><span aria-hidden="true">Visão</span></button>
    <button class="side-btn" id="btnCenter" aria-label="Recentralizar a câmera"><svg class="i" aria-hidden="true"><use href="#i-target"/></svg><span aria-hidden="true">Centro</span></button>
    <div class="zoom-par" role="group" aria-label="Zoom"><button class="side-btn mini" id="btnMais" aria-label="Aproximar"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button><button class="side-btn mini" id="btnMenos" aria-label="Afastar"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button></div>
  </div>

  <button id="mission">
    <div><div class="mk">Missão</div><div class="mt" id="mTitle"></div><div class="ms" id="mSub"></div></div>
    <div class="ring"><svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="mRing" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/></svg><b id="mReward"></b></div>
  </button>

  <section id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="shTitle">
    <div class="sh-head">
      <button class="icon-btn back" id="shBack" aria-label="Voltar" hidden><svg class="i"><use href="#i-back"/></svg></button>
      <div class="ic" id="shIc"></div>
      <div><h2 id="shTitle" tabindex="-1"></h2><div class="sub" id="shSub"></div></div>
      <button class="icon-btn" id="shClose" aria-label="Fechar"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </section>

  <nav id="nav" aria-label="Áreas do jogo">
    <button class="nav-btn" data-tab="market" aria-current="page" aria-controls="sheet"><svg class="i" aria-hidden="true"><use href="#i-store"/></svg>Mercado</button>
    <button class="nav-btn" data-tab="upgrade" aria-controls="sheet" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-up"/></svg>Melhorar<span class="dot" id="dotUpgrade" hidden><span class="sr-only"> (há melhorias disponíveis)</span></span></button>
    <button class="nav-btn main" data-tab="expand" aria-controls="sheet" aria-expanded="false"><span class="bubble"><svg class="i" aria-hidden="true"><use href="#i-grow"/></svg></span>Expandir</button>
    <button class="nav-btn" data-tab="tasks" aria-controls="sheet" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-tasks"/></svg>Tarefas<span class="badge" id="badgeTasks" hidden style="right:calc(50% - 26px);top:4px">0</span></button>
    <button class="nav-btn" data-tab="ach" aria-controls="sheet" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-medal"/></svg>Conquistas<span class="badge" id="badgeAch" hidden style="right:calc(50% - 26px);top:4px">0</span></button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="anuncio" class="sr-only" aria-live="polite"></div>
<div id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<script>
// Carregamento confiável: se algum módulo não chegar (rede instável, servidor recusando conexões),
// o jogo não fica pela metade. Recarrega sozinho até 2 vezes e depois oferece "Tentar de novo".
window.__boot = { falhas: [], ok: false };
addEventListener("error", function (e) { var t = e.target; if (t && t.tagName === "SCRIPT" && t.src) window.__boot.falhas.push(t.src.split("/").pop()); }, true);
// 1.3: últimos erros de script, para o "Relatar problema" (só mensagem e local, nada digitado pelo jogador)
window.__erros = [];
function __regErro(m) { try { window.__erros.push({ t: Date.now(), m: String(m).slice(0, 180) }); if (window.__erros.length > 8) window.__erros.shift(); } catch (x) {} }
addEventListener("error", function (e) { if (e.message) __regErro(e.message + " @ " + String(e.filename || "").split("/").pop() + ":" + e.lineno); });
addEventListener("unhandledrejection", function (e) { __regErro("promessa: " + (e.reason && e.reason.message || e.reason)); });
addEventListener("load", function () {
  if (window.__boot.ok) return;
  var n = 0; try { n = +(sessionStorage.getItem("mercadinho-recarga") || 0); } catch (e) {}
  if (n < 2) { try { sessionStorage.setItem("mercadinho-recarga", String(n + 1)); } catch (e) {} location.reload(); return; }
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#1f4d3a;color:#fff;font:700 16px system-ui;text-align:center;padding:24px";
  d.innerHTML = "<div><p>Não foi possível carregar o jogo por completo" + (window.__boot.falhas.length ? " (" + window.__boot.falhas.join(", ") + ")" : "") + ".</p><p>Seu progresso salvo não foi alterado.</p><button style=\"font:800 16px system-ui;padding:12px 18px;border:0;border-radius:12px;background:#f2b233\">Tentar de novo</button></div>";
  d.querySelector("button").onclick = function () { try { sessionStorage.removeItem("mercadinho-recarga"); } catch (e) {} location.reload(); };
  document.body.appendChild(d);
});
</script>
