<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mercadinho da Esquina</title>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercadinho">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: the store fills the screen and can be dragged and zoomed.
     HUD, mission card, side buttons and bottom navigation float above it; panels open as sheets. */
  :root {
    --bg: #f6f1e3; --panel: #fffcf4; --ink: #2a2620; --muted: #625a4b; --line: #e7dfca;
    --green: #1f4d3a; --green-2: #2e7a57; --green-3: #3f9a6d; --gold: #f2b233; --gold-2: #ffd36b; --gold-ink: #4a3203;
    --gold-edge: #c98f17; --red: #c9513a; --sky: #3f74b8;
    --hud: rgba(24, 61, 45, .94); --hud-line: rgba(255,255,255,.14);
    --display: "Baloo 2", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --nav-h: 62px; --gap: 10px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --shadow: 0 3px 0 rgba(0,0,0,.12), 0 8px 22px rgba(30,25,10,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color-scheme: light; background: #b9d08f; color: var(--ink);
    font-family: var(--body); overscroll-behavior: none; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: fixed; inset: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* foco visível em fundo claro e escuro: contorno azul-escuro com halo branco */
  :is(button, summary, [tabindex]):focus-visible { outline: 3px solid #1f5fa8; outline-offset: 2px; box-shadow: 0 0 0 6px #fff; }
  #shTitle:focus { outline: none; } #shTitle:focus-visible { outline: 3px solid #1f5fa8; outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .i.fill { fill: currentColor; stroke: none; }

  /* ---------- scene ---------- */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: #b9d08f; }
  #c.dragging { cursor: grabbing; }
  #c.hot { cursor: pointer; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  /* ---------- top HUD ---------- */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
    display: grid; gap: 6px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .hud-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px 0 4px; border-radius: 17px; border: 0;
    background: var(--hud); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.18); font: 800 15px var(--display); line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; }
  .chip .badge-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .chip.lvl .badge-ic { background: linear-gradient(180deg, #ffd96e, #f2a922); color: #8a5300; }
  .chip.lvl .badge-ic .i { width: 18px; height: 18px; }
  .chip.money { flex: 1 1 auto; max-width: 190px; }
  .chip.money .badge-ic { background: linear-gradient(180deg, #ffe07a, #e9a51e); color: #7a4b00; font: 800 15px var(--display); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .chip.money b { overflow: hidden; text-overflow: ellipsis; font-size: 17px; }
  #money.neg { color: #ffb4a3; }
  #money.pulse { animation: pulse .35s ease-out; }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.12); color: #ffe08a; } 100% { transform: scale(1); } }
  .chip.rep { padding-left: 8px; color: #ffd36b; }
  .chip.rep b { color: #fff; }
  .chip.rep .i { width: 17px; height: 17px; }
  .spacer { flex: 1 1 0; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; position: relative;
    background: var(--hud); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .1s; }
  .round:active, .chip:active, .side-btn:active { transform: scale(.94); }
  .hud-row2 { display: flex; align-items: center; gap: 8px; }
  #progress { flex: 1 1 auto; min-width: 0; border: 0; border-radius: 16px; padding: 5px 10px 7px; background: var(--hud); color: #fff;
    box-shadow: 0 2px 0 rgba(0,0,0,.18); text-align: left; display: grid; gap: 4px; max-width: 520px; }
  #progress .ptop { display: flex; justify-content: space-between; gap: 8px; font: 800 13px var(--display); line-height: 1.1; }
  #progress .ptop span:last-child { color: var(--gold-2); white-space: nowrap; }
  #tierName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar { height: 14px; border-radius: 7px; background: rgba(255,255,255,.16); position: relative; overflow: hidden; }
  .pbar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(180deg, #ffd96e, #f2a922); border-radius: 7px; transition: width .3s; }
  .pbar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); background-size: 220% 100%; animation: shine 2.6s linear infinite; }
  .pbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 10.5px var(--body); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: nowrap; }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .round.gift { width: 46px; height: 46px; background: linear-gradient(180deg, #ffd96e, #f2a922); color: #7a3f00; box-shadow: 0 3px 0 var(--gold-edge); }
  .round.gift .i { width: 26px; height: 26px; }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; border-radius: 10px; padding: 0 5px; background: #e2553c; color: #fff;
    font: 800 11px var(--body); display: grid; place-items: center; box-shadow: 0 1px 0 rgba(0,0,0,.25); animation: bob 1.2s ease-in-out infinite; }
  .badge[hidden], .dot[hidden] { display: none; }
  .dot { position: absolute; top: 6px; right: calc(50% - 18px); width: 10px; height: 10px; border-radius: 50%; background: #e2553c; box-shadow: 0 0 0 2px var(--hud); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .hud-row3 { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { height: 24px; padding: 0 9px; border-radius: 12px; background: rgba(24,61,45,.82); color: #fff; font: 800 11.5px var(--body);
    display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill .rush { background: var(--gold); color: var(--gold-ink); border-radius: 6px; padding: 0 5px; }
  .pill.warn { background: rgba(201,81,58,.92); }
  .pill.ok { background: rgba(46,122,87,.9); }

  /* ---------- side shortcuts ---------- */
  #side { position: absolute; right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + var(--nav-h) + 92px); display: grid; gap: 8px; transition: opacity .2s, transform .2s; }
  .side-btn { width: 50px; border: 0; border-radius: 14px; padding: 6px 0 4px; background: rgba(255,252,244,.95); color: var(--green);
    box-shadow: var(--shadow); display: grid; justify-items: center; gap: 1px; font: 800 10px var(--body); transition: transform .1s; }
  .side-btn .i { width: 22px; height: 22px; }
  .zoom-par { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .side-btn.mini { padding: 6px 0; min-height: 40px; align-content: center; }
  .side-btn[aria-pressed="true"] { background: var(--green); color: #fff; }

  /* ---------- mission card ---------- */
  #mission { position: absolute; left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + var(--nav-h) + 10px);
    max-width: 380px; border: 0; border-radius: 16px; padding: 8px 8px 8px 12px; background: rgba(255,252,244,.97); box-shadow: var(--shadow);
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; transition: transform .15s, opacity .2s; }
  #mission:active { transform: scale(.98); }
  #mission .mk { font: 800 10px var(--body); color: var(--green-2); letter-spacing: .5px; text-transform: uppercase; }
  #mission .mt { font: 800 14px var(--display); line-height: 1.15; color: var(--ink); }
  #mission .ms { font: 700 11.5px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ring { width: 48px; height: 48px; position: relative; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .bg { stroke: #ece4cf; } .ring .fg { stroke: var(--green-3); stroke-linecap: round; transition: stroke-dashoffset .3s; }
  .ring b { font: 800 10px var(--body); color: var(--gold-ink); text-align: center; line-height: 1.05; max-width: 40px; }
  #mission.done { background: linear-gradient(180deg, #fff6d6, #ffe7a3); }
  #mission.done .ring .fg { stroke: var(--gold); }

  /* ---------- bottom navigation ---------- */
  #nav { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 calc(var(--sar) + 6px) var(--sab) calc(var(--sal) + 6px);
    height: calc(var(--nav-h) + var(--sab)); background: linear-gradient(180deg, #24573f, #183d2d); box-shadow: 0 -2px 0 rgba(0,0,0,.08), 0 -6px 18px rgba(0,0,0,.12);
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; z-index: 3; }
  .nav-btn { position: relative; height: var(--nav-h); border: 0; background: none; color: rgba(255,255,255,.88); display: grid; justify-items: center; align-content: center;
    gap: 2px; font: 800 11px var(--body); padding: 0; transition: color .15s; }
  .nav-btn .i { width: 24px; height: 24px; transition: transform .15s; }
  .nav-btn[aria-current="page"] { color: #fff; }
  .nav-btn[aria-current="page"]::before { content: ""; position: absolute; top: 6px; width: 46px; height: 34px; border-radius: 12px; background: rgba(255,255,255,.14); }
  .nav-btn[aria-current="page"] .i { transform: translateY(-1px) scale(1.08); }
  .nav-btn[aria-current="page"]::after { content: ""; position: absolute; bottom: 4px; width: 18px; height: 3px; border-radius: 2px; background: var(--gold); }
  .nav-btn.main { align-content: end; padding-bottom: 7px; }
  .nav-btn.main .bubble { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin-top: -26px;
    background: linear-gradient(180deg, #ffd96e, #f2a922); color: #6b3a00; box-shadow: 0 4px 0 var(--gold-edge), 0 0 0 4px #1f4d3a; transition: transform .12s; }
  .nav-btn.main .bubble .i { width: 30px; height: 30px; }
  .nav-btn.main[aria-current="page"]::before { display: none; }
  .nav-btn.main[aria-current="page"] .bubble { transform: translateY(-2px); box-shadow: 0 6px 0 var(--gold-edge), 0 0 0 4px #fff; }
  .nav-btn:active .i, .nav-btn.main:active .bubble { transform: scale(.92); }

  /* ---------- sheets ---------- */
  #sheet { position: absolute; left: calc(var(--sal) + 8px); right: calc(var(--sar) + 8px); bottom: calc(var(--sab) + var(--nav-h) + 30px);
    max-height: min(54%, calc(100% - var(--sat) - var(--sab) - var(--nav-h) - 150px)); max-width: 560px; margin: 0 auto;
    background: var(--panel); border-radius: var(--r-lg); box-shadow: 0 -2px 0 rgba(0,0,0,.05), 0 12px 40px rgba(20,15,5,.35);
    display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
  #sheet[hidden] { display: none; }
  #sheet.in { animation: sheetUp .26s cubic-bezier(.2,1.1,.4,1); }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sh-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .sh-head > div:nth-child(3) { flex: 1 1 auto; min-width: 0; }
  .sh-head .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; color: var(--green); }
  .sh-head h2 { margin: 0; font: 800 19px var(--display); line-height: 1.05; }
  .sh-head .sub { font: 700 12px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .icon-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0; background: #f1ead8; color: var(--ink); display: grid; place-items: center; }
  .icon-btn[hidden] { display: none; }
  .icon-btn:active { transform: scale(.94); }
  .sh-head > .back { margin-right: -2px; }
  .sh-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 10px; display: grid; gap: 10px; align-content: start; touch-action: pan-y; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #efe7d3; border-radius: 12px; }
  .seg button { border: 0; border-radius: 9px; padding: 8px; font: 800 13px var(--body); background: none; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--green); box-shadow: inset 0 -3px 0 var(--green-2), 0 1px 0 rgba(0,0,0,.08); }
  .sec-title { font: 800 12px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 4px 2px -4px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
  .stat { background: #f6efdc; border-radius: 12px; padding: 7px 9px; min-width: 0; }
  .stat small { display: block; font: 800 11px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .stat b { display: block; font: 800 15px var(--display); line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 6px; border-radius: 3px; background: #ece4cf; overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--green-2); transition: width .25s; }
  .note { font: 700 13px var(--body); color: var(--muted); line-height: 1.38; margin: 0 2px; }
  .warn { background: #fbe6df; color: var(--red); border-radius: 10px; padding: 9px 11px; font-size: 13px; font-weight: 700; }

  /* action row: title + benefit on the left, cost on the right */
  .acts { display: grid; gap: 6px; }
  .act { position: relative; border: 0; border-radius: 12px; padding: 8px 8px 8px 11px; background: #f6efdc; text-align: left;
    display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; min-height: 52px; overflow: hidden; transition: transform .1s, background .2s; }
  .act b { font: 800 13.5px var(--body); grid-column: 1; }
  .act span { font: 700 12px var(--body); color: var(--muted); grid-column: 1; line-height: 1.25; }
  .act em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font: 800 13px var(--body); font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 8px 11px; border-radius: 10px; background: #e6dcc3; color: #8a7c5f; min-width: 74px; text-align: center; }
  .act.can em { background: linear-gradient(180deg, #ffd96e, #f2a922); color: var(--gold-ink); box-shadow: 0 2px 0 var(--gold-edge); }
  .act.can em::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
    background-size: 250% 100%; animation: shine 3s linear infinite; pointer-events: none; }
  .act.can:active { transform: translateY(1px); }
  .act.max em { background: #d6ead9; color: var(--green-2); }
  .act.lack em { color: #a3341f; background: #f7e1da; }
  .act.lack em::after { content: "sem saldo"; display: block; font-size: 10px; font-weight: 800; }   /* estado em texto, não só pela cor */
  .act.pop { animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.04); background: #c9ecd5; } 100% { transform: scale(1); } }
  .act.shake { animation: shake .32s; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* list rows (Melhorar / Expandir) */
  .row { border: 0; border-radius: 14px; background: #fff; box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); padding: 8px 10px 8px 8px;
    display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; position: relative; }
  .row:active { transform: scale(.99); }
  .row .ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 22px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }
  .row .t { font: 800 15px var(--display); line-height: 1.1; }
  .row .s { font: 700 12px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .go { font: 800 12px var(--body); color: var(--green-2); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .row .go .n { background: var(--gold); color: var(--gold-ink); border-radius: 9px; padding: 1px 7px; }
  .row.locked { background: #f4eddb; box-shadow: inset 0 0 0 1.5px #ddd0ae; }
  .row.locked .t { color: #8f8263; }
  .row.cur { box-shadow: inset 0 0 0 2px var(--gold); }
  .req { display: flex; justify-content: space-between; gap: 8px; font: 800 12.5px var(--body); font-variant-numeric: tabular-nums; }
  .req span:last-child { color: var(--muted); }
  .card { background: #fff; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); padding: 10px; display: grid; gap: 8px; }
  .card h3 { margin: 0; font: 800 15px var(--display); }
  .task { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: center; }
  .task .tt { font: 800 12.5px var(--body); min-width: 0; }
  .task .act { min-height: 40px; padding: 4px; grid-template-columns: 1fr; }
  .task .act b, .task .act span { display: none; }
  .task .act em { grid-column: 1; grid-row: 1; min-width: 0; }
  table.rep { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.rep td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  table.rep td:last-child { text-align: right; font-weight: 800; }
  .pos { color: var(--green-2); } .neg { color: var(--red); }
  .price { display: flex; align-items: center; gap: 8px; }
  .price b { font: 800 22px var(--display); min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
  .price .icon-btn { font: 800 22px var(--body); background: #f6efdc; }
  .chipbtn { border: 0; border-radius: 10px; padding: 9px 12px; background: #d6ead9; color: var(--green-2); font: 800 13px var(--body); margin-left: auto; }
  .chipbtn:active { transform: scale(.96); }
  .danger { border: 0; border-radius: 12px; padding: 12px; background: #f7e1da; color: var(--red); font: 800 14px var(--body); }
  .plain { border: 0; border-radius: 12px; padding: 12px; background: #f6efdc; color: var(--ink); font: 800 14px var(--body); text-align: left; display: flex; gap: 10px; align-items: center; }
  .plain .i { color: var(--green-2); }

  /* ---------- toast and modal ---------- */
  #toast { position: fixed; left: 50%; top: calc(var(--sat) + 128px); transform: translate(-50%, -6px); background: rgba(42,38,32,.94); color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
    max-width: min(90vw, 420px); text-align: center; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #modal { position: fixed; inset: 0; background: rgba(30,26,18,.6); display: grid; place-items: center; padding: 16px; z-index: 30; }
  #modal[hidden] { display: none; }
  .dialog { background: var(--panel); border-radius: 18px; padding: 20px; width: min(360px, 100%); box-shadow: 0 14px 40px rgba(0,0,0,.3); max-height: 90%; overflow-y: auto; }
  .dialog h2 { font-family: var(--display); margin: 0 0 4px; font-size: 24px; line-height: 1.1; }
  .dialog p { margin: 6px 0 10px; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .dialog table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin: 6px 0 14px; }
  .dialog td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .dialog td:last-child { text-align: right; font-weight: 800; }
  .dialog .warn { margin-bottom: 12px; }
  #modal:not([hidden]) .dialog { animation: dialogIn .38s cubic-bezier(.2,1.3,.4,1); }

<script>
// Carregamento confiável: se algum módulo não chegar (rede instável, servidor recusando conexões),
// o jogo não fica pela metade. Recarrega sozinho até 2 vezes e depois oferece "Tentar de novo".
window.__boot = { falhas: [], ok: false };
addEventListener("error", function (e) { var t = e.target; if (t && t.tagName === "SCRIPT" && t.src) window.__boot.falhas.push(t.src.split("/").pop()); }, true);
addEventListener("load", function () {
  if (window.__boot.ok) return;
  var n = 0; try { n = +(sessionStorage.getItem("mercadinho-recarga") || 0); } catch (e) {}
  if (n < 2) { try { sessionStorage.setItem("mercadinho-recarga", String(n + 1)); } catch (e) {} location.reload(); return; }
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#1f4d3a;color:#fff;font:700 16px system-ui;text-align:center;padding:24px";
  d.innerHTML = "<div><p>Não foi possível carregar o jogo por completo" + (window.__boot.falhas.length ? " (" + window.__boot.falhas.join(", ") + ")" : "") + ".</p><p>Seu progresso salvo não foi alterado.</p><button style=\"font:800 16px system-ui;padding:12px 18px;border:0;border-radius:12px;background:#f2b233\">Tentar de novo</button></div>";
  d.querySelector("button").onclick = function () { try { sessionStorage.removeItem("mercadinho-recarga"); } catch (e) {} location.reload(); };
  document.body.appendChild(d);
});
</script>

<script>
"use strict";
// =====================================================================
// Clientes diversos, atendimento prioritário, ajuda da equipe e circulação acessível.
//
// Princípios (decisão do usuário, ver MEMORIA.md):
// - Todos os perfis fazem o ciclo completo: chegam (a pé ou de carro), pegam cesta, escolhem produtos,

// - Cão-guia, cadeira, andador, bengala e carrinho de bebê fazem parte do próprio cliente (desenho e espaço);
//   nunca são entidades separadas e nunca ocupam lugar próprio na fila.
// - A prioridade vem de um dado do cliente (categorias), não da aparência: há pessoas idosas sem bengala,
//   pessoas de aparência mais velha sem direito à prioridade e prioridades que não aparecem (gestação,
//   lactação, autismo, deficiência não aparente). Quem tem direito escolhe se usa (autonomia).

//   doadores de sangue. §3º: prioridade por caixa específico; §4º: sem caixa específico, atendimento logo

// - Lei 10.741/2003, art. 3º, §2º: entre as pessoas idosas, prioridade especial aos maiores de 80 anos,

// - Lei 13.146/2015, art. 9º: atendimento prioritário à pessoa com deficiência, extensivo ao acompanhante.
// - Lei 11.126/2005: pessoa com deficiência visual pode entrar e permanecer com o cão-guia.
// - Carrinho de bebê: nenhuma dessas leis o menciona; "criança de colo" não é definida. O jogo NÃO trata
//   carrinho de bebê como prioridade legal. A loja pode oferecer cortesia (opção no caixa, desligada de início),
//   que vem depois das prioridades legais.
// Simplificação do jogo: para ninguém ser esquecido, um cliente sem prioridade é ultrapassado no máximo

// =====================================================================
const PERFIS = {
  //            nome no painel                       velocidade  meia-largura  espaço na fila  pede ajuda
  padrao:  { nome: "Cliente",                        vel: 1,     larg: 9,      prof: 22,       ajuda: 0.03 },
  idoso:   { nome: "Pessoa idosa",                   vel: 0.92,  larg: 9,      prof: 22,       ajuda: 0.08 },
  cadeira: { nome: "Pessoa em cadeira de rodas",     vel: 1,     larg: 12,     prof: 28,       ajuda: 0.3 },
  caoguia: { nome: "Pessoa cega com cão-guia",       vel: 0.95,  larg: 10,     prof: 30,       ajuda: 0.5 },
  bengala: { nome: "Pessoa com bengala",             vel: 0.82,  larg: 10,     prof: 22,       ajuda: 0.15 },
  andador: { nome: "Pessoa com andador",             vel: 0.75,  larg: 11,     prof: 28,       ajuda: 0.25 },

const SORTEIO_PERFIL = [["cadeira", 0.05], ["caoguia", 0.03], ["andador", 0.04], ["bengala", 0.05], ["bebe", 0.06], ["idoso", 0.08]];

  pcd:      "Pessoa com deficiência",
  idoso:    "Pessoa idosa (60 anos ou mais)",
  idoso80:  "Pessoa idosa com 80 anos ou mais",
  mobred:   "Pessoa com mobilidade reduzida",
  gestante: "Gestante",
  lactante: "Lactante",

const CAES = ["#d9a35b", "#2a2620", "#c8a26a", "#8a5a2b"];

const novoHojeAcess = () => ({ ajudas: 0, semAjuda: 0, prio: 0 });
function acess() {

}
function fecharDiaAcess(L) {

// ---------- perfil de cada cliente ----------
function perfilar(c) {

  const u = Math.random();

  if (p === "cadeira" || p === "caoguia") c.cat = ["pcd"];

    if (u < 0.68) { c.cat = ["idoso"]; c.idade = 60 + Math.floor(Math.random() * 20); }
    else if (u < 0.9) { c.cat = ["idoso", "idoso80"]; c.idade = 80 + Math.floor(Math.random() * 12); }

}

const prioCortesia = c => !!c.bebe && !prioLegal(c) && acess().cortesiaBebe;

const nivelPrio = c => !usaPrio(c) ? 0 : prioLegal(c) ? 2 : 1;            // legal antes da cortesia da loja

function descreverPrio(c) {

  if (prioLegal(c)) return c.cat.filter(k => k !== "idoso" || !tem80(c)).map(k => CATEGORIAS[k]).join(", ");
  return "Cortesia da loja: pessoa com bebê no carrinho";
}

// ---------- caixa prioritário e ordem da fila ----------
const caixaPrio = () => Math.max(0, Math.min(acess().caixaPrio, S.cashiers - 1));
// c passa à frente de o? Prioridade legal antes de cortesia, cortesia antes de quem não tem; entre pessoas idosas,
// quem tem 80+ passa à frente das outras pessoas idosas (e só delas). Ninguém passa à frente de quem já foi
// ultrapassado MAX_ULTRAPASSAGENS vezes (proteção do jogo contra cliente esquecido).
function passaNaFrente(c, o) {
  if ((o.ultr || 0) >= MAX_ULTRAPASSAGENS) return false;

let qChegSeq = 0;

function filaOrdenada(l) {
  const sid = lanes[l] && lanes[l].servingId;
  const todos = customers.filter(c => c.lane === l && (c.state === "toLane" || c.state === "queue"));
  const atendendo = todos.find(c => c.id === sid) || null;                // nunca sai da frente
  const naFila = todos.filter(c => c !== atendendo && c.state === "queue").sort(porFila);
  const chegando = todos.filter(c => c !== atendendo && c.state !== "queue").sort(porChegada);   // só entra na ordem quando chega à fila

  for (const o of customers) if (o !== head && o.lane === l && o.state === "queue" && (o.qChegou || 0) < (head.qChegou || 0)) o.ultr = (o.ultr || 0) + 1;
}
// escolha do caixa: quem usa a prioridade vai ao caixa prioritário, salvo se outro caixa estiver vazio;
// os demais preferem os outros caixas quando há gente com prioridade esperando
function escolherCaixa(c) {

function posFila(l, i, q) {

  for (let k = 0; k < i; k++) d += (perfilDe(q[k]).prof + perfilDe(q[k + 1]).prof) / 2;

// ---------- ajuda opcional da equipe ----------
// O cliente pede (ou não). Um carrinheiro livre vai até ele e acompanha por um tempo; a compra continua
// normalmente o tempo todo, com ou sem ajuda. Há limites de tempo dos dois lados: ninguém fica preso.
function pedirAjuda(c) { if (c.pedeAjuda && !c.ajuda) c.ajuda = { estado: "pedindo", t: 0 }; }

  if (a.t > AJUDA_ESPERA || c.state === "toLane" || c.state === "queue" || c.state === "exit" || c.state === "angry") {

const cestasFolga = () => station.b + station.c + station2.b + station2.c >= 4 || piles.every(p => p.b + p.c === 0);

  const terminou = fora || c.state === "toLane" || c.state === "queue" || c.state === "exit" || c.state === "angry";
  const faltaCesta = station.b + station.c === 0 && piles.some(p => p.b + p.c > 0);   // volta para recolher cestas

  } else {

}

// ---------- circulação acessível: dados comuns a desenho, movimento e verificação ----------

const saidasCaixa = () => LANES.map(ln => ({ x: ln.serve.x, w: 2 * AJ.saida }));

}

function partesCaixa(l) {

}
function obstaculos() {
  const o = [];
  SHELVES.forEach((sh, i) => o.push({ x: sh.x - 4, y: sh.y - 5, w: sh.w + 8, h: sh.h + 11, nome: "gôndola " + (i + 1) }));

// dados do registro de conclusão que ajudam a reabrir uma loja sem estado guardado
function reabrirComum(r) {
  r = r || {};

  S.served = r.atendidos || 0; S.earned = r.faturamento || 0;

}
// capítulos 4 a 8 são declarados nos módulos 06d a 06i (carregados depois deste); por isso o início da
// sessão de carreira roda em iniciarCarreira(), chamado em 13-hud-loop antes de o jogo começar
let CFG = null;
const novaFase = () => ({ dia: { t: 0, vazio: 0, vs: {}, promoVazio: 0, vend: {} }, bons: 0, nets: [], margens: [], hist: [], concluida: false, promo: null, promosOk: 0, promosFeitas: 0 });
// estado dos fornecedores de uma loja (capítulo 3; regras em 06c)
function fornNovo() { return { pedidos: [], recebidos: { ligeira: 0, serra: 0 }, auto: true, seq: 1, hist: [], recusas: 0 }; }
function gravarCarreira() { try { localStorage.setItem(CHAVE_CARREIRA, JSON.stringify(CARREIRA)); } catch (e) {} }

// ---------- início da sessão de carreira ----------
// introFasePendente: loja nova do capítulo atual (mostra a introdução)

let introFasePendente = false, lojaReaberta = false;
function iniciarCarreira() {
  if (!NA_CARREIRA) return;
  CFG = FASE_CFG[FASE];

  if (!CARREIRA.lojas[FASE]) {                            // loja sem estado: nova (capítulo atual) ou reaberta (concluída)
    const rec = CARREIRA.fases[FASE];
    S = freshState(); S.seenIntro = true; CFG.inicio(); S.fase = novaFase();
    if (rec && rec.concluida) {
      if (!S.forn) S.forn = fornNovo();
      CFG.reabrir(rec); S.fase.concluida = true; S.fase.diaConclusao = rec.dia; S.reaberta = Date.now(); lojaReaberta = true;
    } else introFasePendente = true;

    CARREIRA.lojas[FASE] = S; gravarCarreira();
  }
  if (!S.fase) S.fase = novaFase();
  S.fase = Object.assign(novaFase(), S.fase);
  if (CFG.carregar) CFG.carregar();            // campos novos de cada capítulo (partidas antigas recebem valores padrão)
}

// ---------- ganchos chamados pelo motor (neutros fora da carreira) ----------
const promoAtiva = () => NA_CARREIRA && S.fase && S.fase.promo && S.fase.promo.dia === S.day ? S.fase.promo : null;
function promoFator(sec) { const p = promoAtiva(); return p && SECTORS[sec].id === p.sec ? PROMO.desconto : 1; }
function promoFluxo() { return promoAtiva() ? PROMO.fluxo : 1; }
function promoPlano(plan) {
  const p = promoAtiva(); if (!p) return;
  const i = SECTORS.findIndex(d => d.id === p.sec); if (!S.sec[p.sec].open) return;
  const it = plan.find(x => x.sec === i);
  if (it) it.want++;
  else if (Math.random() < PROMO.chance) { plan.push({ sec: i, want: 1 + (Math.random() < .5 ? 1 : 0), got: 0 }); plan.sort((a, b) => a.sec - b.sec); }
}
function vendaSetor(sec, n) { if (NA_CARREIRA && S.fase) { const v = S.fase.dia.vend, id = SECTORS[sec].id; v[id] = (v[id] || 0) + n; if (CFG.fornecedores) fornVenda(sec, n); } }
function faseTick(dt) {
  if (!NA_CARREIRA || !S.fase) return;
  const d = S.fase.dia; d.t += dt;
  // disponibilidade: média, entre os essenciais abertos, do tempo com a gôndola vazia
  const abertos = CFG.essenciais.filter(id => S.sec[id].open);
  if (abertos.length) { const vaz = abertos.filter(id => S.sec[id].shelf === 0).length; d.vazio += dt * vaz / abertos.length; d.vs = d.vs || {}; abertos.forEach(id => { if (S.sec[id].shelf === 0) d.vs[id] = (d.vs[id] || 0) + dt; }); }
  const p = promoAtiva(); if (p && S.sec[p.sec].shelf === 0) d.promoVazio += dt;
  if (CFG.fornecedores) fornTick();
  if (CFG.tick) CFG.tick(dt);

}

// ---------- avaliação de cada dia ----------
function avaliarDia() {
  const d = S.fase.dia, L = S.lastDay, tot = L.served + L.lost, c = CFG.dia;
  const vazio = d.t > 0 ? d.vazio / d.t : 0, perdidos = tot ? L.lost / tot : 0;
  const itens = [
    { ok: vazio <= c.vazioMax, txt: `Gôndolas essenciais vazias ${Math.round(vazio * 100)}% do tempo, em média (máx. ${Math.round(c.vazioMax * 100)}%)` },
    { ok: perdidos <= c.perdidosMax, txt: `Clientes perdidos ${Math.round(perdidos * 100)}% (máx. ${Math.round(c.perdidosMax * 100)}%)` },
    { ok: S.rep >= c.repMin - 1e-9, txt: `Reputação ${S.rep.toFixed(1).replace(".", ",")} (mín. ${String(c.repMin).replace(".", ",")})` },
    { ok: S.money >= 0, txt: S.money >= 0 ? "Contas pagas sem dívida" : "Dia fechado no vermelho" },
  ];
  if (CFG.avaliar) CFG.avaliar(itens, L, vazio, perdidos);        // critérios próprios do capítulo (fila, custo da equipe, entregas...)
  if (CFG.semGondolas) itens.splice(0, 2);                          // shopping: sem gôndolas nem fila de caixa
  return { ok: itens.every(i => i.ok), itens, vazio, perdidos };
}
function faseFimDoDia() {
  if (!NA_CARREIRA || !S.fase) return;
  const f = S.fase, av = avaliarDia(), L = S.lastDay;
  f.bons = av.ok ? f.bons + 1 : 0;
  f.nets.push(Math.round(L.net * 100) / 100); while (f.nets.length > 3) f.nets.shift();
  if (CFG.fimDoDia) CFG.fimDoDia(L, av);
  if (CFG.fornecedores) { fornFimDoDia(L); f.margens.push(Math.round(L.margem * 1000) / 1000); while (f.margens.length > 3) f.margens.shift(); f.vendOntem = Object.assign({}, f.dia.vend); }
  f.hist.push({ dia: L.day, ok: av.ok, itens: av.itens.map(i => ({ ok: i.ok, txt: i.txt })) }); while (f.hist.length > 7) f.hist.shift();
  // resultado da promoção do dia
  const p = f.promo;
  if (p && p.dia === L.day) {
    const vendas = f.dia.vend[p.sec] || 0, vaz = f.dia.t ? f.dia.promoVazio / f.dia.t : 0;
    p.vendas = vendas; p.ok = vendas >= p.meta && vaz <= 0.2 && L.net > 0;
    p.motivo = p.ok ? "Sucesso" : vendas < p.meta ? `Vendeu ${vendas} de ${p.meta}` : vaz > 0.2 ? "Gôndola ficou vazia por muito tempo" : "O dia fechou no prejuízo";
    if (p.ok) f.promosOk++;

    setTimeout(() => banner(p.ok ? `📣 Promoção de ${nomeSetor(p.sec)}: sucesso!` : `📣 Promoção: ${p.motivo}`, p.ok ? "#2e7a57" : "#b7773b"), 1600);
  }
  f.dia = { t: 0, vazio: 0, vs: {}, promoVazio: 0, vend: {} };
  if (!av.ok && !f.concluida) setTimeout(() => toast(`Dia não contou para a meta: ${av.itens.filter(i => !i.ok).map(i => i.txt).join(" · ")}`), 2600);
}

    <rect x="0" y="22" width="220" height="10" fill="#7f878c"/>
    <rect x="4" y="36" width="30" height="30" rx="3" fill="#cbc9bb" stroke="#8e7350"/>${[0, 1, 2].map(i => `<rect x="${8 + i * 9}" y="44" width="7" height="7" rx="1" fill="#c99a5b"/>`).join("")}
    <rect x="40" y="36" width="150" height="66" rx="4" fill="#f3f3ef" stroke="#1f7a3a" stroke-width="1.5"/>
    <rect x="44" y="38" width="66" height="12" rx="2" fill="#8e7350"/><rect x="122" y="38" width="60" height="10" rx="2" fill="#1f7a3a"/><rect x="128" y="44" width="40" height="3" fill="#f4c430"/>
    ${[0, 1, 2].map(c => [0, 1].map(r => `<rect x="${46 + c * 48}" y="${56 + r * 14}" width="40" height="6" rx="1.5" fill="#b89a6c"/>`).join("")).join("")}
    ${[0, 1, 2].map(i => `<rect x="${62 + i * 28}" y="90" width="14" height="6" rx="1.5" fill="#4b5a62"/>`).join("")}
    <rect x="186" y="78" width="6" height="14" rx="1" fill="#1f7a3a"/>
    <rect x="40" y="104" width="150" height="13" rx="3" fill="#9aa3a6"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="${46 + i * 12}" y="106" width="1" height="9" fill="#fff"/>`).join("")}
  </svg>`;
}

// ---------- promoções ----------
function metaPromo() { return PROMO.metaBase + 4 * S.cashiers; }   // mais caixas, mais vendas esperadas
function iniciarPromo(id) {
  if (!CFG || !CFG.promocoes || promoAtiva() || !S.sec[id] || !S.sec[id].open) return;
  if (S.money < PROMO.panfleto) { toast(`Falta dinheiro: o panfleto custa M ${PROMO.panfleto}.`); return; }
  S.money -= PROMO.panfleto; S.today.goods += PROMO.panfleto;
  S.fase.promo = { sec: id, dia: S.day, meta: metaPromo(id) }; S.fase.promosFeitas++;
  banner(`📣 Promoção: ${nomeSetor(id)} 20% mais barato hoje!`, "#1d3461"); save(); lastSig = ""; renderSheet();
}
function desenharPromo() {
  const p = promoAtiva(); if (!p) return;
  const i = SECTORS.findIndex(d => d.id === p.sec), sh = SHELVES[i]; if (!sh) return;

  rr(sh.x + sh.w - 52, y, 50, 13, 6, "#c9302c"); text("OFERTA −20%", sh.x + sh.w - 27, y + 9, 7, "#fff");
}

// ---------- painel e missão ----------
function buildCarreira(body) {
  const f = S.fase, reqs = faseReqs(), nx = proximaFase();
  head("🗺️", "#e4ece6", `Capítulo ${CFG.capitulo}: ${CFG.titulo}`, () => `${CFG.lugar} · ${reqs.filter(r => r.have >= r.need - 1e-9).length} de ${reqs.length} requisitos`);
  const bm = el("button", "plain", `${iconSvg("i-map")}<span>Mapa da carreira: lojas, distâncias e próximas etapas</span>`); bm.onclick = () => { closeSheet(); abrirMapa(); }; body.appendChild(bm);
  const disp = proximaDisponivel(), atual = CARREIRA.fase;
  if (f.concluida) {
    const outra = atual !== FASE && !disp;
    const card = el("div", "card", disp ? `<h3>Fase concluída</h3><p class="note">O ${FASE_CFG[disp].titulo} espera por você. Assuma quando quiser; aqui nada se perde.</p>`
      : outra ? `<h3>Loja concluída</h3><p class="note">Você está administrando o ${CFG.titulo}, que já cumpriu as metas. O capítulo em andamento é o ${FASE_CFG[atual].capitulo}: ${FASE_CFG[atual].titulo}.</p>`
      : `<h3>Carreira concluída</h3><p class="note">Todos os capítulos foram cumpridos. Continue administrando o ${CFG.titulo} e as outras lojas da sua rede.</p>`);
    if (disp) { const b = el("button", "btn", `Ver convite do ${FASE_CFG[disp].titulo}`); b.onclick = () => { closeSheet(); abrirMapa(disp); }; card.appendChild(b); }
    else if (outra) { const b = el("button", "btn", `Ir para o ${FASE_CFG[atual].titulo}`); b.onclick = () => { closeSheet(); abrirMapa(atual); }; card.appendChild(b); }
    body.appendChild(card);
  }
  if (CFG.fornecedores) body.appendChild(cartaoFornecedores());
  if (CFG.cartoes) CFG.cartoes().forEach(c => body.appendChild(c));
  if (CFG.promocoes) body.appendChild(cartaoPromo());
  body.appendChild(el("div", "sec-title", "Requisitos para avançar"));
  reqs.forEach(r => {
    const ok = r.have >= r.need - 1e-9, txt = r.mostra ? r.mostra() : r.money ? `M ${fmt(r.have)} / M ${fmt(r.need)}` : r.pct ? `${Math.round(r.have * 100)}% / ${Math.round(r.need * 100)}%` : `${Math.min(r.have, r.need) === r.have ? fmt(r.have) : fmt(r.need)}/${fmt(r.need)}`;
    const row = el("div", "card req-card" + (ok ? " ok" : ""), `<div class="req"><span>${ok ? "✅" : "⬜"} ${r.label}</span><b>${txt}</b></div><p class="note">${r.como}</p>`);
    body.appendChild(row);
  });
  // o dia de hoje, ao vivo
  const c = CFG.dia;
  body.appendChild(el("div", "sec-title", "Hoje (avaliado no fechamento)"));
  body.appendChild(statsBox([
    ["Gôndolas vazias (média)", () => `${Math.round((f.dia.t ? f.dia.vazio / f.dia.t : 0) * 100)}% (máx. ${Math.round(c.vazioMax * 100)}%)`],
    ["Clientes perdidos", () => { const t = S.today.served + S.today.lost; return `${t ? Math.round(S.today.lost / t * 100) : 0}% (máx. ${Math.round(c.perdidosMax * 100)}%)`; }],
    ["Reputação", () => `${S.rep.toFixed(1).replace(".", ",")} (mín. ${String(c.repMin).replace(".", ",")})`],
    ["Dias seguidos", () => `${f.bons} de ${CFG.diasSeguidos}`],
  ]));
  if (f.hist.length) {
    const h = f.hist[f.hist.length - 1];
    body.appendChild(el("div", "card", `<h3>Dia ${h.dia}: ${h.ok ? "contou ✅" : "não contou"}</h3>${h.itens.map(i => `<div class="req"><span>${i.ok ? "✅" : "❌"} ${i.txt}</span></div>`).join("")}`));
  }
  body.appendChild(el("div", "sec-title", "Opcional"));
  const op = el("button", "plain", `${iconSvg("i-tasks")}<span>Tarefas do dia e baú: dinheiro extra, não são exigidas</span>`); op.onclick = () => openSheet("tasks"); body.appendChild(op);
  const oa = el("button", "plain", `${iconSvg("i-medal")}<span>Conquistas: vão para o seu histórico de carreira</span>`); oa.onclick = () => openSheet("ach"); body.appendChild(oa);
  body.appendChild(el("div", "sec-title", "Sua carreira"));
  body.appendChild(statsBox([
    ["Nível de gestão", () => `${nivelGestao()} (${CARREIRA.xp} XP)`],
    ["Reputação da carreira", () => CARREIRA.repCarreira ? `${String(CARREIRA.repCarreira).replace(".", ",")} ★` : "—"],
    ["Conquistas", () => String(CARREIRA.conquistas.length)],
    ["Capítulos concluídos", () => String(Object.values(CARREIRA.fases).filter(x => x.concluida).length)],
  ]));
  body.appendChild(el("p", "note", "Inspirado em Maricá. Os estabelecimentos são fictícios; formatos, lotes e expansões são adaptações do jogo."));
}
function cartaoPromo() {
  const p = promoAtiva(), f = S.fase, card = el("div", "card");
  if (p) {
    card.innerHTML = `<h3>📣 Promoção de hoje: ${nomeSetor(p.sec)}</h3><p class="note">20% mais barato, procura em dobro e +15% de movimento até a noite. Meta: vender ${p.meta} unidades sem deixar a gôndola vazia por muito tempo e fechar o dia no lucro.</p><div class="req"><span>Vendidas hoje</span><b id="pVend"></b></div>`;
    live(() => { const e = card.querySelector("#pVend"); if (e) e.textContent = `${f.dia.vend[p.sec] || 0} / ${p.meta}`; });
    return card;
  }
  card.innerHTML = `<h3>📣 Promoção do dia</h3><p class="note">Escolha uma categoria: ela fica 20% mais barata e mais procurada, e o movimento geral sobe 15%. Custa M ${PROMO.panfleto} de panfleto. Dá certo se a gôndola não esvaziar e o dia fechar no lucro: pense em estoque, repositores e caixas antes de escolher.</p>
    <p class="note">Bem-sucedidas: <b>${f.promosOk}</b> de ${f.promosFeitas}${f.ultimaPromo ? ` · última: ${nomeSetor(f.ultimaPromo.sec)}, ${f.ultimaPromo.motivo.toLowerCase()}` : ""}</p>`;
  const g = el("div", "acts");
  SECTORS.filter((d, i) => i < slots() && S.sec[d.id].open).forEach(d => {
    const st = S.sec[d.id], b = el("button", "act", `<b>${d.ic} ${d.name}</b><span>Gôndola ${st.shelf}/${shelfCap(st.shelfLvl)} · depósito ${st.wh}</span><em>M ${PROMO.panfleto}</em>`);
    b.onclick = () => iniciarPromo(d.id); g.appendChild(b);
  });
  card.appendChild(g); return card;
}
function missaoCarreira() {
  if (!NA_CARREIRA) return null;
  const f = S.fase, disp = proximaDisponivel();
  if (f.concluida) {
    if (disp) return { title: `Assumir o ${FASE_CFG[disp].titulo}`, sub: "Convite no mapa da carreira", p: 1, ring: "Ir", done: true, go: () => abrirMapa(disp) };
    if (CARREIRA.fase !== FASE) return { title: `${CFG.titulo}: loja concluída`, sub: `Capítulo em andamento: ${FASE_CFG[CARREIRA.fase].titulo} · ver mapa`, p: 1, ring: "🗺️", done: true, go: () => abrirMapa(CARREIRA.fase) };
    return { title: "Carreira concluída", sub: "Sua rede em Maricá · ver mapa", p: 1, ring: "🏆", done: true, go: () => abrirMapa() };
  }
  if (CFG.metaPromos && !promoAtiva() && S.dayT < DAY_LEN * 0.5 && f.promosOk < CFG.metaPromos) return { title: "Escolher a promoção do dia", sub: `${f.promosOk} de ${CFG.metaPromos} bem-sucedidas · aba Carreira`, p: f.promosOk / CFG.metaPromos, ring: "📣", go: () => openSheet("expand") };
  if (CFG.fornecedores) { const m = missaoFornecedor(); if (m) return m; }
  if (CFG.missao) { const m = CFG.missao(); if (m) return m; }
  const r = faseReqs().find(q => q.have < q.need - 1e-9 && q.tipo === "melhoria");
  if (r) return { title: r.label, sub: r.como, p: r.have / r.need, ring: `${Math.round(faseProgresso() * 100)}%`, go: () => openSheet(r.painel || (CFG.fornecedores && (r.id === "ligeira" || r.id === "serra") ? "forn" : "expand")) };
  const d = faseReqs().find(q => q.id === "dias");
  if (d.have < d.need) return { title: `Dias bem administrados: ${d.have}/${d.need}`, sub: "Gôndolas cheias, filas curtas, reputação e contas em dia", p: d.have / d.need, ring: `${Math.round(faseProgresso() * 100)}%`, go: () => openSheet("expand") };
  const mg = faseReqs().find(q => q.id === "margem");
  if (mg && mg.have < mg.need) return { title: `Margem média: ${Math.round(mg.have * 100)}% de ${Math.round(mg.need * 100)}%`, sub: "Compre lotes com desconto e evite perdas por validade", p: mg.have / mg.need, ring: `${Math.round(faseProgresso() * 100)}%`, go: () => openSheet("forn") };
  const l = faseReqs().find(q => q.id === "lucro");
  return { title: `Lucro médio: M ${fmt(l.have)} de M ${fmt(l.need)}`, sub: "Média dos últimos 3 dias fechados", p: l.have / l.need, ring: `${Math.round(faseProgresso() * 100)}%`, go: () => openSheet("expand") };
}

<script>
"use strict";
// =====================================================================
// Capítulo 3 (Supermercado Ipê): negociação com fornecedores.
// - Duas ofertas por setor, fáceis de comparar: Distribuidora Ligeira (lote pequeno, preço cheio,
//   entrega no mesmo dia) e Atacado Serra (lote grande, 25% de desconto, entrega em 2 dias, ocupa
//   mais depósito). Custo total, quantidade, prazo e espaço aparecem antes de confirmar.
// - O pedido é pago na hora e reserva espaço no depósito até chegar. Pedidos pendentes ficam no
//   estado da loja (S.forn): sobrevivem a troca de loja, fechar o app e progresso offline.
// - A reposição automática do distribuidor continua como emergência: só até 6 caixas por setor
//   e 30% mais cara. Pode ser desligada.
// - Margem: cada setor guarda o custo médio da mercadoria (st.cu); a venda soma o custo do que saiu.
// - Compra ruim tem conserto: perecíveis parados perdem 10% por dia, e dá para repassar excedente
//   (metade do custo), cancelar pedido a caminho (multa de 20%) ou fazer promoção.
// Fora do capítulo 3 nada daqui roda: fornAtivo() é falso e os ganchos não mexem em nada.
// =====================================================================
const FORN = {
  ligeira: { id: "ligeira", nome: "Distribuidora Ligeira", pedir: "Pedir à Ligeira", ic: "🚐", cor: "#3f74b8", lote: 30, fator: 1, prazo: 30,
    prazoTxt: "no mesmo dia (cerca de 4 h de jogo)", resumo: "Lote pequeno, entrega rápida, preço cheio" },
  serra: { id: "serra", nome: "Atacado Serra", pedir: "Pedir ao Serra", ic: "🚛", cor: "#b7773b", lote: 90, fator: 0.75, prazo: 180,
    prazoTxt: "em 2 dias de jogo", resumo: "Desconto de 25% por volume, entrega demorada, ocupa mais depósito" },
};
const FORN_CFG = { fatorAuto: 1.3, emergencia: 6, multa: 0.2, repasse: 0.5, repasseLote: 10, validade: 0.15, maxPendentes: 8 };
const PERECIVEIS = new Set(["hortifruti", "laticinios", "padaria", "acougue", "frios"]);
const fornAtivo = () => NA_CARREIRA && !!CFG && !!CFG.fornecedores;
const tAbs = () => (S.day - 1) * DAY_LEN + S.dayT;          // tempo de jogo da loja, em segundos
const secDef = id => SECTORS.find(d => d.id === id);
const pct = v => `${Math.round(v * 100)}%`;
function fornEstado() {
  if (!S.forn) S.forn = fornNovo();
  const f = S.forn; f.pedidos = f.pedidos || []; f.recebidos = Object.assign({ ligeira: 0, serra: 0 }, f.recebidos || {});
  if (f.auto === undefined) f.auto = true; f.hist = f.hist || []; f.seq = f.seq || 1; return f;
}
const reservado = () => fornAtivo() ? fornEstado().pedidos.reduce((a, p) => a + p.qtd, 0) : 0;
const livreDeposito = () => whCap(S.whLvl) - whUsed() - reservado();
function custoUnit(d, st) { if (!(st.cu > 0)) st.cu = boxCost(d, st.priceLvl); return st.cu; }
// mercadoria que entra no setor: atualiza o custo médio do que está na loja (depósito, gôndola e mãos dos repositores)
function entrouEstoque(d, k, unit) {
  const st = S.sec[d.id], tem = Math.max(0, st.wh + st.shelf + (pending[d.id] || 0)), cu = custoUnit(d, st);
  st.cu = Math.round((cu * tem + unit * k) / Math.max(1, tem + k) * 10000) / 10000;
}
function fornVenda(sec, n) { const d = SECTORS[sec], st = S.sec[d.id]; S.today.cmv = (S.today.cmv || 0) + n * custoUnit(d, st); }

// ---------- ofertas, recusas e pedidos ----------
function oferta(fid, secId) {
  const fo = FORN[fid], d = secDef(secId), st = S.sec[secId];
  const unit = Math.round(boxCost(d, st.priceLvl) * fo.fator * 100) / 100, total = Math.round(unit * fo.lote * 100) / 100, venda = secPrice(d, st.priceLvl);
  return { fo, d, st, unit, total, qtd: fo.lote, venda, margem: 1 - unit / venda, prazo: fo.prazo, espaco: fo.lote, perecivel: PERECIVEIS.has(secId) };
}
function motivoRecusa(o) {
  const livre = livreDeposito();
  if (!o.st.open) return { tipo: "setor", curto: "Setor fechado", txt: `${o.d.name} ainda está fechado. Abra o setor antes de comprar mercadoria para ele.` };
  if (S.money < 0) return { tipo: "dinheiro", curto: "Caixa no vermelho", txt: `Pedido recusado: o caixa está no vermelho (−M ${fmt(-S.money)}). Os fornecedores só vendem à vista; saia da dívida antes de comprar.` };
  if (S.money < o.total) return { tipo: "dinheiro", curto: `Faltam M ${fmt(o.total - S.money)}`, txt: `Pedido recusado por falta de dinheiro: o lote custa M ${fmt(o.total)} e o caixa tem M ${fmt(S.money)}. Faltam M ${fmt(o.total - S.money)}. Venda mais, repasse excedente ou escolha o lote menor.` };
  if (o.espaco > livre) return { tipo: "espaco", curto: `Só ${Math.max(0, livre)} caixas livres`, txt: `Pedido recusado por falta de espaço: o lote ocupa ${o.espaco} caixas e o depósito tem ${Math.max(0, livre)} livres (capacidade ${whCap(S.whLvl)}, ${whUsed()} ocupadas, ${reservado()} reservadas para pedidos a caminho). Amplie o depósito, repasse excedente, espere vender ou escolha o lote menor.` };
  if (fornEstado().pedidos.length >= FORN_CFG.maxPendentes) return { tipo: "limite", curto: "Muitos pedidos a caminho", txt: `Já há ${FORN_CFG.maxPendentes} pedidos a caminho. Espere algum chegar antes de pedir de novo.` };
  return null;
}
function fazerPedido(fid, secId) {
  if (!fornAtivo() || !FORN[fid] || !S.sec[secId]) return { ok: false };
  const o = oferta(fid, secId), r = motivoRecusa(o), f = fornEstado();

  S.money -= o.total; S.today.goods += o.total;

<script>
"use strict";
// =====================================================================
// Capítulo 4 (Supermercado Restinga): delegar a gestão.
// - Responsáveis com custo e efeito visível:
//   · Encarregado de reposição: repositor sem serviço no próprio setor vai ajudar a gôndola mais vazia.
//   · Líder de setor: repõe à mão a gôndola dele quando ela baixa da metade e acalma quem espera
//     (+3 s de paciência naquele setor).
//   · Fiscal de frente de loja: pode decidir sozinho quantos volantes vão para os caixas, recolhe cestas
//     paradas nos caixas e segura a fila (+3 s de paciência na fila).
// - Volantes: equipe flexível. Cada volante abre um caixa extra OU repõe qualquer setor. O plano diz
//   quantos vão ao caixa fora do pico e no pico: é a escolha entre fila curta e gôndola cheia.
// - Métricas do dia: tempo médio de fila, custo da equipe sobre as vendas e resultado do horário de pico.
// O mesmo quadro de volantes é usado no capítulo 5 (lá também separam pedidos de entrega).
// Fora dos capítulos 4 e 5 nada daqui roda.
// =====================================================================
const EQ = {
  encarregado: { contratar: 400, salario: 45 },
  lider: { contratar: 150, salario: 18 },
  fiscal: { contratar: 350, salario: 40 },
  volante: { contratar: 120, salario: 20, max: 4 },
  liderRepoe: 1.6, liderAte: 0.6, paciencia: 3, fiscalCestas: 5, fiscalDecide: 3,
};
const EQ_ATIVO = NA_CARREIRA && (FASE === "restinga" || FASE === "pitanga");
const novaEquipe = () => ({ encarregado: false, lideres: {}, fiscal: false, volantes: 0, plano: { normal: 0, pico: 1 }, planoDefinido: false, auto: false,
  hoje: novoHojeEq(), picos: [], picosOk: 0, custos: [], filas: [] });
const novoHojeEq = () => ({ filaSoma: 0, filaN: 0, pT: 0, pVazio: 0, pFilaSoma: 0, pFilaN: 0, pLost: 0, pServed: 0, naCaixaT: 0 });
function eq() {
  if (!S.equipe) S.equipe = novaEquipe();
  const e = S.equipe; e.lideres = e.lideres || {}; e.plano = Object.assign({ normal: 0, pico: 1 }, e.plano || {});
  e.hoje = Object.assign(novoHojeEq(), e.hoje || {}); e.picos = e.picos || []; e.custos = e.custos || []; e.filas = e.filas || [];
  return e;
}
const nLideres = () => Object.keys(eq().lideres).filter(id => eq().lideres[id] && S.sec[id] && S.sec[id].open).length;
const salariosEquipe = () => { const e = eq(); return (e.encarregado ? EQ.encarregado.salario : 0) + nLideres() * EQ.lider.salario + (e.fiscal ? EQ.fiscal.salario : 0) + e.volantes * EQ.volante.salario; };
const vagasCaixaVolante = () => Math.max(0, LANES.length - S.cashiers);
// quantos volantes o plano manda para os caixas agora (o fiscal pode ajustar sozinho, em modo automático)
let autoCaixa = null;
function alvoCaixa() {
  const e = eq(), lim = Math.min(e.volantes, vagasCaixaVolante());
  if (e.fiscal && e.auto && autoCaixa != null) return Math.min(lim, autoCaixa);
  return Math.min(lim, isRush() ? e.plano.pico : e.plano.normal);
}

// ---------- volantes (pessoas no cenário) ----------
const volantes = [];
function syncVolantes() {
  const e = eq();
  while (volantes.length < e.volantes) volantes.push({ id: 700 + volantes.length, x: P.whDoor.x, y: P.whDoor.y + 6, papel: "repor", state: "idle", path: [], carry: 0, sec: null, skin: pick(SKIN), hair: pick(HAIR) });
  while (volantes.length > e.volantes) { const v = volantes.pop(); if (v.carry && v.sec != null) { const id = SECTORS[v.sec].id; pending[id] -= v.carry; S.sec[id].wh += v.carry; } }
}
const papelEntrega = () => typeof entregaPapeis === "function" ? entregaPapeis() : 0;   // capítulo 5: separadores de pedidos
function distribuirPapeis() {
  const nc = alvoCaixa(), ns = Math.min(volantes.length - nc, papelEntrega());
  volantes.forEach((v, i) => {
    const quer = i < nc ? "caixa" : i < nc + ns ? "separar" : "repor";
    if (v.papel !== quer) trocarPapel(v, quer);
  });
}
function trocarPapel(v, papel) {
  if (v.carry && v.sec != null) { const id = SECTORS[v.sec].id; pending[id] -= v.carry; S.sec[id].wh += v.carry; v.carry = 0; }   // devolve o que levava
  if (v.pedido != null && typeof soltarPedido === "function") soltarPedido(v);                                // capítulo 5: o pedido volta para a fila
  v.papel = papel; v.state = "indo"; v.sec = null;
  if (papel === "caixa") { const k = volantes.filter(o => o.papel === "caixa").indexOf(v), l = Math.min(LANES.length - 1, S.cashiers + k); v.lane = l;
    const a = corredorPara(v.x, LANES[l].x + 27); v.path = [{ x: a, y: v.y }, { x: a, y: FZ + 10 }, { x: LANES[l].x + 27, y: FZ + 10 }, { x: LANES[l].x + 27, y: FZ + 96 }]; }
  else if (papel === "separar") v.path = typeof caminhoExpedicao === "function" ? caminhoExpedicao(v) : routeTo(v, P.whDoor.x, P.whDoor.y + 6);
  else { const a = corredorPara(v.x, P.whDoor.x); v.path = [{ x: a, y: v.y }, { x: a, y: P.whDoor.y + 6 }, { x: P.whDoor.x, y: P.whDoor.y + 6 }]; }

const caixasDeVolante = () => volantes.filter(v => v.papel === "caixa" && v.state === "caixa").length;
// setor que mais precisa: menor ocupação da gôndola, com estoque no depósito e espaço livre
function setorMaisVazio(ignorar) {
  let best = null, bp = 2;
  SHELVES.forEach((sh, i) => { const d = SECTORS[i], st = S.sec[d.id]; if (!st.open || i === ignorar) return;
    const cap = shelfCap(st.shelfLvl), livre = cap - st.shelf - pending[d.id]; if (livre <= 0 || st.wh <= 0) return;
    const p = (st.shelf + pending[d.id]) / cap; if (p < bp) { bp = p; best = i; } });
  return { i: best, p: bp };
}
function passoVolante(v, dt) {
  const sp = staffSpd(1);
  if (v.state === "indo") { if (follow(v, sp, dt)) v.state = v.papel === "caixa" ? "caixa" : v.papel === "separar" ? "separando" : "idle"; return; }
  if (v.papel === "caixa") return;                                   // atende no caixa (o desenho do operador é o do caixa)
  if (v.papel === "separar") { if (typeof passoSeparador === "function") passoSeparador(v, dt, sp); return; }
  if (v.state === "idle") {
    const alvo = setorMaisVazio(); if (alvo.i == null || alvo.p > 0.85) return;
    const d = SECTORS[alvo.i], st = S.sec[d.id], sh = SHELVES[alvo.i];
    const n = Math.min(staffCarry(1), st.wh, shelfCap(st.shelfLvl) - st.shelf - pending[d.id]);
    st.wh -= n; v.carry = n; v.sec = alvo.i; pending[d.id] += n; v.state = "go";
    const a = corredorPara(P.whDoor.x, sh.cx); v.aisle = a;
    v.path = [{ x: a, y: P.whDoor.y + 6 }, { x: a, y: sh.top }, { x: sh.cx + 22, y: sh.top }];
  } else if (v.state === "go") {
    if (follow(v, sp, dt)) {
      const d = SECTORS[v.sec], st = S.sec[d.id], put = Math.min(v.carry, shelfCap(st.shelfLvl) - st.shelf);
      if (put) markPop(v.sec, st.shelf, st.shelf + put);
      st.shelf += put; pending[d.id] -= v.carry; v.carry -= put; v.state = "back";
      v.path = [{ x: v.aisle, y: SHELVES[v.sec].top }, { x: v.aisle, y: P.whDoor.y + 6 }, { x: P.whDoor.x, y: P.whDoor.y + 6 }];
    }
  } else if (v.state === "back") {
    if (follow(v, sp, dt)) { if (v.carry) S.sec[SECTORS[v.sec].id].wh += v.carry; v.carry = 0; v.sec = null; v.state = "idle"; }
  }
}

// ---------- efeitos dos responsáveis ----------
let tLider = 0, tFiscal = 0, tDecide = 0;
function tickEquipe(dt) {
  const e = eq();
  syncVolantes();
  // fiscal em modo automático: olha filas e gôndolas a cada 3 s e move um volante por vez
  if (e.fiscal && e.auto) {
    tDecide += dt;
    if (tDecide >= EQ.fiscalDecide || autoCaixa == null) {
      tDecide = 0; const n = nCaixas(), filas = LANES.slice(0, n).reduce((a, _, l) => a + laneQueue(l).length, 0) / Math.max(1, n);
      const ess = CFG.essenciais.filter(id => S.sec[id].open), vaz = ess.filter(id => S.sec[id].shelf === 0).length / Math.max(1, ess.length);
      const lim = Math.min(e.volantes - papelEntrega(), vagasCaixaVolante());
      if (autoCaixa == null) autoCaixa = Math.min(lim, isRush() ? e.plano.pico : e.plano.normal);
      if (filas >= 2.2 && vaz < 0.34 && autoCaixa < lim) autoCaixa++;
      else if ((vaz >= 0.2 || filas <= 0.6) && autoCaixa > 0) autoCaixa--;
    }
  } else autoCaixa = null;
  distribuirPapeis();
  volantes.forEach(v => passoVolante(v, dt));
  // líderes de setor repõem à mão
  tLider += dt;
  if (tLider >= EQ.liderRepoe) {
    tLider = 0;
    SHELVES.forEach((sh, i) => { const d = SECTORS[i], st = S.sec[d.id];
      if (e.lideres[d.id] && st.open && st.wh > 0 && st.shelf < shelfCap(st.shelfLvl) * EQ.liderAte) { markPop(i, st.shelf, st.shelf + 1); st.wh--; st.shelf++; } });
  }
  // fiscal recolhe uma cesta parada nos caixas a cada 5 s
  if (e.fiscal) { tFiscal += dt; if (tFiscal >= EQ.fiscalCestas) { tFiscal = 0; const l = piles.findIndex((p, k) => k < LANES.length && p.b + p.c > 0);
    if (l >= 0) { const p = piles[l], dest = ENT2 && station2.b + station2.c < station.b + station.c ? station2 : station; if (p.c > 0) { p.c--; dest.c++; } else { p.b--; dest.b++; } } } }
  // métricas do dia e do pico
  const h = e.hoje;
  if (isRush()) {
    h.pT += dt; const ess = CFG.essenciais.filter(id => S.sec[id].open);
    if (ess.length) h.pVazio += dt * ess.filter(id => S.sec[id].shelf === 0).length / ess.length;
    h.naCaixaT += dt * caixasDeVolante();
  }
}
function atendidoEquipe(c) {
  const h = eq().hoje; h.filaSoma += c.qWait || 0; h.filaN++;
  if (isRush()) { h.pFilaSoma += c.qWait || 0; h.pFilaN++; h.pServed++; }
}
const perdasNoPico = { n: 0 };
// ---------- fim do dia: tempo de fila, custo da equipe e resultado do pico ----------
const metaPico = { vazio: 0.15, fila: 7, perdidos: 0.12 };
function fimDoDiaEquipe(L) {
  const e = eq(), h = e.hoje;
  L.filaMedia = h.filaN ? h.filaSoma / h.filaN : 0;
  L.custoEquipe = wages(); L.custoPct = L.sales > 0 ? L.custoEquipe / L.sales : 1;
  e.custos.push(Math.round(L.custoPct * 1000) / 1000); while (e.custos.length > 3) e.custos.shift();
  e.filas.push(Math.round(L.filaMedia * 10) / 10); while (e.filas.length > 3) e.filas.shift();
  if (h.pT > 1) {
    const pv = h.pVazio / h.pT, pf = h.pFilaN ? h.pFilaSoma / h.pFilaN : 0, pl = h.pServed + h.pLost ? h.pLost / (h.pServed + h.pLost) : 0;
    const ok = pv <= metaPico.vazio && pf <= metaPico.fila && pl <= metaPico.perdidos;
    const pico = { dia: L.day, vazio: pv, fila: pf, perdidos: pl, ok, volCaixa: h.naCaixaT / h.pT, motivo: ok ? "Pico bem atendido" : pv > metaPico.vazio ? "gôndolas vazias demais no pico" : pf > metaPico.fila ? "fila longa no pico" : "muitos clientes perdidos no pico" };
    e.picos.unshift(pico); e.picos.length = Math.min(e.picos.length, 5); if (ok) e.picosOk++;
    L.pico = pico;
    setTimeout(() => banner(ok ? "⏱️ Pico bem atendido!" : `⏱️ Pico: ${pico.motivo}`, ok ? "#2e7a57" : "#b7773b"), 3400);
  }
  e.hoje = novoHojeEq(); autoCaixa = null;
}

function pagarContratacao(v, oque) {

}
function nomear(papel, sec) {

  else if (papel === "fiscal") { if (e.fiscal) { e.fiscal = false; e.auto = false; toast("Fiscal dispensado: o plano dos volantes volta a ser fixo."); }
    else if (pagarContratacao(EQ.fiscal.contratar, "o fiscal")) { e.fiscal = true; banner("🧾 Fiscal de frente de loja nomeado", "#1f5fa8"); } }

function mudarVolantes(d) {

}

  save(); lastSig = ""; renderSheet();
}

// ---------- volantes separando (chamado por passoVolante, em 06d) ----------
const EXPED = () => ({ x: LOJA.expedicao || Math.round((LOJA.letreiro.x + LOJA.letreiro.w + W) / 2), y: 118 });
function caminhoExpedicao(v) { return routeTo(v, P.whDoor.x, P.whDoor.y + 6); }
function passoSeparador(v, dt, sp) {
  const e = ent(), o = v.pedido != null ? e.pedidos.find(p => p.id === v.pedido) : null;
  if (v.pedido != null && !o) { v.pedido = null; v.state = "voltando"; v.path = [{ x: P.whDoor.x, y: P.whDoor.y + 6 }]; }
  if (v.state === "separando") {                         // parado na porta do depósito, esperando pedido completo
    const prox = e.pedidos.filter(p => p.estado === "aceito" && !faltando(p)).sort((a, b) => (a.prazo - a.idade) - (b.prazo - b.idade))[0];
    if (prox) { prox.estado = "separando"; v.pedido = prox.id; v.pick = 0; v.state = "pegando"; }
  } else if (v.state === "pegando") {
    v.pick += dt * (1 + 0.35 * e.balcao);
    if (o && v.pick >= ENT_CFG.porPedido + unidades(o) * ENT_CFG.porUnidade) { const x = EXPED(); v.state = "levando"; v.path = [{ x: P.whDoor.x, y: 118 }, { x: x.x - 14, y: 118 }]; }
  } else if (v.state === "levando") {
    if (follow(v, sp, dt)) { if (o) { o.estado = "pronto"; lastSig = ""; } v.pedido = null; v.state = "voltando"; v.path = [{ x: P.whDoor.x, y: 118 }, { x: P.whDoor.x, y: P.whDoor.y + 6 }]; }
  } else if (v.state === "voltando") {
    if (follow(v, sp, dt)) v.state = "separando";
  } else if (v.state === "idle") v.state = "separando";
}

function contratarMotoboy(d) {

  if (d > 0) { if (e.motoboys >= ENT_CFG.motoboy.max) { toast(`No máximo ${ENT_CFG.motoboy.max} motoboys.`); return; } if (!pagarContratacao(ENT_CFG.motoboy.contratar, "um motoboy com moto")) return; e.motoboys++; banner("🛵 Motoboy contratado", "#2e7d32"); }
  else if (e.motoboys > 1) { if (e.pedidos.filter(o => o.estado === "rota").length >= e.motoboys) { toast("Espere o motoboy voltar da entrega."); return; } e.motoboys--; }
  ["manha", "tarde"].forEach(t => e.turnos[t].mot = Math.min(e.turnos[t].mot, e.motoboys));

// ---------- desenho: balcão de expedição e motos ----------
function desenharExpedicao() {
  const e = ent(), x = EXPED(), bx = x.x - 46;
  rr(bx, 46, 92, 64, 8, "#e9e4d6"); rr(bx + 3, 49, 86, 14, 5, "#2e7d32"); text("EXPEDIÇÃO", x.x, 59, 8, "#fff", "center", 800);
  // prateleira de bolsas: uma por pedido pronto (até 6)
  const prontos = e.pedidos.filter(o => o.estado === "pronto");
  for (let k = 0; k < 6; k++) { const px = bx + 8 + (k % 3) * 26, py = 68 + Math.floor(k / 3) * 18; rr(px, py, 22, 14, 3, k < prontos.length ? "#c62828" : "rgba(0,0,0,.08)"); if (k < prontos.length) text(String(prontos[k].id), px + 11, py + 10, 7, "#fff"); }
  rr(bx + 4, 104, 84, 6, 2, "#7c6a4a");
  // motos na calçada (as de serviço) e as que estão na rua
  const rota = e.pedidos.filter(o => o.estado === "rota"), paradas = Math.max(0, motosDeServico() - rota.length);
  for (let k = 0; k < paradas; k++) moto(bx + 10 + k * 22, 36, false);
  rota.forEach((o, k) => { const ida = zonaDe(o).ida, f = o.rota < ida ? o.rota / ida : 1 - (o.rota - ida) / ida, xx = x.x + f * (W + 220 - x.x); moto(xx, 12 + (k % 2) * 8, o.rota < ida); });
  if (pressao.aviso) { rr(bx - 4, 112, 100, 13, 5, "#b7773b"); text("⚠ LOJA SOFRENDO", x.x, 121.5, 7, "#fff", "center", 800); }
}
function moto(x, y, indo) {
  ctx.save(); ctx.translate(x, y); if (!indo) ctx.scale(-1, 1);
  rr(-9, -3, 18, 5, 2, "#c62828"); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-7, 3, 3, 0, 7); ctx.arc(7, 3, 3, 0, 7); ctx.fill();
  rr(-6, -10, 8, 8, 2, "#2e7d32"); rr(1, -9, 5, 4, 2, "#f2b233");
  ctx.restore();
}

function gerarProposta(L, cfg, renovar) {
  if (renovar) { const u = renovar, o = u.ocup;
    const p = { id: L.seq++, unidade: u.id, ramo: o.ramo, nome: o.nome, aluguel: Math.round(o.aluguel * 1.06), pct: o.pct || 0, dias: o.diasContrato, risco: o.risco, idade: 0, renovacao: true };

  const vagas = L.unidades.filter(u => !u.ocup && !L.propostas.some(p => p.unidade === u.id)); if (!vagas.length) return null;

function aceitarProposta(L, id) {

function tickLocacao(L, cfg, dt) {

function diaLocacao(L, cfg, extraReceita) {
  let receita = 0, atrasou = 0; const fins = [];
  ocupadas(L).forEach(u => {
    const o = u.ocup, devido = o.aluguel + (o.pct ? o.vendas * o.pct : 0);
    if (Math.random() < o.risco) { o.divida += devido; o.atrasos++; atrasou++; }

<script>

// =====================================================================
const AT_CFG = {

const novoAtac = () => ({ nPos: 6, pos: Array.from({ length: 9 }, () => ({ sec: null, fardos: 0 })), dep: {}, depLvl: 0, docas: 1, ops: 2, opsDoca: 1, balcao: 1,
  carretas: [], transito: [], seq: 1, auto: false, hoje: novoHojeAt(), dias: [], totFardos: 0, totMultas: 0 });
const novoHojeAt = () => ({ fardos: 0, receita: 0, custo: 0, comerciantes: 0, perdidos: 0, multas: 0, multaValor: 0, paletes: 0 });
function at() {
  if (!S.atac) S.atac = novoAtac();
  const a = S.atac; a.dep = a.dep || {}; a.carretas = a.carretas || []; a.transito = a.transito || []; a.hoje = Object.assign(novoHojeAt(), a.hoje || {}); a.dias = a.dias || [];

}
function galeria() { if (!S.galeria) S.galeria = novoConjunto([1, 2, 3, 4].map(i => ({ id: "g" + i, tam: "sala", nome: `Sala ${i}` }))); return S.galeria; }

// ---------- geometria: faixa de paletes, balcão do atacado, docas e galeria ----------
const FAIXA = () => ({ y0: 132 + Math.ceil(slots() / COLS) * 74 - 6, y1: FZ - 16 });
function posPalete(k) {          // 3 por coluna, nas três primeiras colunas (os corredores ficam livres)
  const col = Math.floor(k / 3), j = k % 3, x0 = LOJA.colunas[col] + 4, f = FAIXA();

}
const BALCAO_AT = () => { const x0 = LOJA.colunas[3], f = FAIXA(); return { x: x0 + 10, y: f.y0 + 4, w: 92, h: 22, serve: { x: x0 + 56, y: f.y0 + 42 } }; };
const DOCA = k => ({ x: DEP.x + 8 + k * 64, y: 2, w: 58, h: 34 });

// ---------- compras de paletes, carretas e docas ----------
function comprarPaletes(id, n, silencioso) {
  const a = at(), c = custoPalete(id) * n;
  if (S.money < c || S.money < 0) { if (!silencioso) toast(`Falta dinheiro: ${n} palete(s) de ${nomeSetor(id)} custam M ${fmt(c)}.`); return false; }
  if (depUsado() + paletesChegando() + n > depCapAt()) { if (!silencioso) toast(`O depósito de paletes não comporta: ${depUsado()} guardados e ${paletesChegando()} a caminho, de ${depCapAt()}.`); return false; }
  S.money -= c; S.today.outrasDesp = (S.today.outrasDesp || 0) + c; a.hoje.custo += c; a.hoje.paletes += n;
  const ult = a.transito[a.transito.length - 1];
  if (ult && ult.t < 3) { ult.itens[id] = (ult.itens[id] || 0) + n; ult.n += n; }        // pedidos seguidos vão na mesma carreta
  else a.transito.push({ id: a.seq++, itens: { [id]: n }, n, t: 0 });
  if (!silencioso) anunciar(`${n} palete(s) de ${nomeSetor(id)} pedidos: M ${fmt(c)}. Chegam de carreta.`);
  lastSig = ""; return true;
}
function tickCarretas(dt, a) {
  for (let k = a.transito.length - 1; k >= 0; k--) { const p = a.transito[k]; p.t += dt; if (p.t >= AT_CFG.chegada) { a.transito.splice(k, 1); a.carretas.push({ id: p.id, itens: p.itens, restante: p.n, espera: 0, multada: false, doca: null }); lastSig = ""; } }
  // carretas encostam nas docas livres, por ordem de chegada
  a.carretas.forEach(c => { if (c.doca == null) { const livre = [...Array(a.docas).keys()].find(d => !a.carretas.some(o => o.doca === d)); if (livre != null) c.doca = livre; } });
  a.carretas.forEach(c => { if (c.doca == null || c.restante > 0) c.espera += dt;
    if (!c.multada && c.espera > AT_CFG.permanencia) { c.multada = true; S.money -= AT_CFG.multa; S.today.outrasDesp = (S.today.outrasDesp || 0) + AT_CFG.multa; a.hoje.multas++; a.hoje.multaValor += AT_CFG.multa; a.totMultas++;
      float(DOCA(c.doca || 0).x + 29, 40, `⏱️ taxa de permanência -M ${AT_CFG.multa}`, "#c9513a"); toastOnce("multaDoca", "Carreta parada demais: taxa de permanência cobrada. Ponha mais empilhadeiras na doca, abra outra doca ou libere espaço no depósito de paletes."); } });
}
// ---------- empilhadeiras ----------
const empilhadeiras = [];
function syncEmpilhadeiras(a) {
  while (empilhadeiras.length < a.ops) empilhadeiras.push({ id: 900 + empilhadeiras.length, x: P.whDoor.x, y: P.whDoor.y + 6, path: [], tarefa: null, t: 0, carga: null });
  while (empilhadeiras.length > a.ops) { const e = empilhadeiras.pop(); devolverTarefa(e); }
  empilhadeiras.forEach((e, i) => e.lugar = i < a.opsDoca ? "doca" : "salao");
}
function devolverTarefa(e) {        // a carga em trânsito volta para onde estava (nada se perde, nada duplica)
  const a = at(); if (!e.tarefa) return;
  if (e.tarefa.tipo === "descarregar" && e.carga) { const c = a.carretas.find(x => x.id === e.tarefa.carreta); if (c) { c.itens[e.carga] = (c.itens[e.carga] || 0) + 1; c.restante++; } else a.dep[e.carga] = (a.dep[e.carga] || 0) + 1; }
  if (e.tarefa.tipo === "levar" && e.carga) { a.dep[e.carga] = (a.dep[e.carga] || 0) + 1; const p = a.pos[e.tarefa.pos]; if (p) p.reservada = false; }
  e.tarefa = null; e.carga = null;
}
function passoEmpilhadeira(e, dt, a) {
  const sp = 70;
  if (!e.tarefa) {
    if (e.lugar === "doca") {
      const c = a.carretas.find(x => x.doca != null && x.restante > 0);
      if (c && depUsado() < depCapAt()) { const id = Object.keys(c.itens).find(k => c.itens[k] > 0); c.itens[id]--; c.restante--; e.carga = id; e.tarefa = { tipo: "descarregar", carreta: c.id }; e.t = 0;
        const d = DOCA(c.doca); e.path = [{ x: e.x, y: 118 }, { x: d.x + 29, y: 118 }]; }
      else if (Math.abs(e.x - P.whDoor.x) > 2 || Math.abs(e.y - (P.whDoor.y + 6)) > 2) { if (!e.path.length) e.path = [{ x: P.whDoor.x, y: P.whDoor.y + 6 }]; follow(e, sp, dt); }
    } else {

// ---------- comerciantes ----------
const comerciantes = []; let tCom = 0;
function novoComerciante(a) {
  const disp = [...new Set(a.pos.slice(0, a.nPos).map(p => p.sec).filter(Boolean))]; if (!disp.length) return;
  const n = Math.min(disp.length, 1 + (Math.random() < 0.45 ? 1 : 0)), secs = disp.slice().sort(() => Math.random() - 0.5).slice(0, n);
  const c = { id: 1000 + Math.floor(Math.random() * 1e6), x: -24, y: FZ + 16, path: [], plano: secs.map(s => ({ sec: s, q: 2 + Math.floor(Math.random() * 3), got: 0 })), passo: 0, estado: "entrando", espera: 0, valor: 0,
    skin: pick(SKIN), hair: pick(HAIR), shirt: pick(["#5d4037", "#37474f", "#455a64", "#6d4c41", "#2e7d32"]) };
  c.path = [{ x: 12, y: FZ + 16 }, { x: 24, y: FZ + 10 }];
  comerciantes.push(c); a.hoje.comerciantes++;
}
function irParaPalete(c, a) {
  const it = c.plano[c.passo]; let k = a.pos.findIndex((p, i) => i < a.nPos && p.sec === it.sec && p.fardos > 0); if (k < 0) k = a.pos.findIndex((p, i) => i < a.nPos && p.sec === it.sec);
  if (k < 0) { c.passo++; return proximoComerciante(c, a); }

  if (c.passo < c.plano.length) return irParaPalete(c, a);
  if (!c.plano.some(i => i.got > 0)) { sairComerciante(c, a, "😠 sem palete"); return; }
  const b = BALCAO_AT(), cor = corredorPara(c.x, b.serve.x); c.estado = "fila"; c.espera = 0; c.qAt = tAbs();
  c.path = [{ x: cor, y: c.y }, { x: cor, y: b.serve.y }, { x: b.serve.x, y: b.serve.y }];
}
function sairComerciante(c, a, motivo) {
  if (motivo) { a.hoje.perdidos++; changeRep(-0.06); float(c.x, c.y - 18, motivo, "#c9513a");
    c.plano.forEach(i => { if (i.got) { const k = a.pos.findIndex((p, j) => j < a.nPos && p.sec === i.sec); if (k >= 0) a.pos[k].fardos += i.got; else a.dep[i.sec] = (a.dep[i.sec] || 0) + Math.ceil(i.got / AT_CFG.palete); i.got = 0; } }); }   // devolve o que pegou
  c.estado = "saindo"; const cor = corredorPara(c.x, 0); c.path = [{ x: cor, y: c.y }, { x: cor, y: FZ + 10 }, { x: 12, y: FZ + 16 }, { x: -30, y: FZ + 16 }];
}
const filaAtac = () => comerciantes.filter(c => c.estado === "fila" || c.estado === "pagando").sort((x, y) => x.qAt - y.qAt);
let tBalcao = [0, 0];
function tickComerciantes(dt, a) {
  // chegada: mais comerciantes com boa reputação e galeria ocupada (lotérica e farmácia atraem gente)
  const temPalete = a.pos.slice(0, a.nPos).some(p => p.sec);
  const taxa = (1 / 8) * (0.7 + S.rep * 0.08) * (1 + fluxoInquilinos(galeria())) * (isRush() ? 1.3 : 1);
  if (temPalete && comerciantes.length < 14 && Math.random() < taxa * dt) novoComerciante(a);
  const fila = filaAtac(), b = BALCAO_AT();
  for (let i = comerciantes.length - 1; i >= 0; i--) {
    const c = comerciantes[i], sp = 62, chegou = follow(c, sp, dt);
    if (c.estado === "entrando" && chegou) { c.passo = 0; irParaPalete(c, a); }
    else if (c.estado === "andando" && chegou) c.estado = "pegando";
    else if (c.estado === "pegando") {
      const it = c.plano[c.passo], p = a.pos[c.alvo];
      if (p && p.sec === it.sec && p.fardos > 0) { c.espera += dt; if (c.espera >= 0.8) { c.espera = 0; p.fardos--; it.got++; if (it.got >= it.q) { c.passo++; proximoComerciante(c, a); } } }
      else { c.espera += dt; if (c.espera > AT_CFG.paciencia || (it.got > 0 && c.espera > 2)) { if (!it.got) float(c.x, c.y - 18, "😕", "#c9513a"); c.passo++; proximoComerciante(c, a); } }
    } else if (c.estado === "fila") {
      const pos = fila.indexOf(c); if (chegou) { const alvo = { x: b.serve.x - pos * 20, y: b.serve.y }; if (Math.abs(c.x - alvo.x) > 1) c.path = [alvo]; }
      c.espera += dt; if (c.espera > AT_CFG.pacienciaFila + 6 * (a.balcao - 1)) { sairComerciante(c, a, "😤 fila do atacado"); continue; }
    } else if (c.estado === "saindo" && chegou) comerciantes.splice(i, 1);
  }

  for (let k = 0; k < a.balcao; k++) {
    const c = filaAtac()[k]; if (!c || c.estado !== "fila" || Math.abs(c.x - (b.serve.x - k * 20)) > 3) { tBalcao[k] = 0; continue; }
    tBalcao[k] += dt; if (tBalcao[k] < AT_CFG.atendimento) continue; tBalcao[k] = 0;
    const v = c.plano.reduce((s, it) => s + it.got * precoFardo(it.sec), 0), nf = c.plano.reduce((s, it) => s + it.got, 0);
    S.money += v; S.earned += v; S.today.outras = (S.today.outras || 0) + v; a.hoje.receita += v; a.hoje.fardos += nf; a.totFardos += nf; changeRep(0.02);
    float(b.serve.x, b.serve.y - 30, `📦 ${nf} fardos +M ${fmt(v)}`, "#2e7a57");
    c.plano.forEach(it => it.got = 0); sairComerciante(c, a, null);

// ---------- tick, fim do dia e reposição automática ----------
let tAutoPal = 0;
function tickAtacado(dt) {
  const a = at();
  tickCarretas(dt, a); syncEmpilhadeiras(a); empilhadeiras.forEach(e => passoEmpilhadeira(e, dt, a)); tickComerciantes(dt, a);
  tickLocacao(galeria(), GAL_CFG, dt);
  if (a.auto) { tAutoPal += dt; if (tAutoPal > 2) { tAutoPal = 0;      // mantém 2 paletes por setor da faixa (depósito + caminho)
    const secs = [...new Set(a.pos.slice(0, a.nPos).map(p => p.sec).filter(Boolean))];
    for (const id of secs) { const tem = (a.dep[id] || 0) + a.transito.reduce((s, p) => s + (p.itens[id] || 0), 0) + a.carretas.reduce((s, c) => s + (c.itens[id] || 0), 0);
      if (tem < 2 && S.money - custoPalete(id) > bills() + 60) { comprarPaletes(id, 1, true); break; } } } }
}
function fecharGaleria() {           // antes do fechamento: aluguéis e custos da galeria entram no resultado do dia
  const d = diaLocacao(galeria(), GAL_CFG);
  S.money += d.receita - d.despesas; S.today.outras = (S.today.outras || 0) + d.receita; S.today.outrasDesp = (S.today.outrasDesp || 0) + d.despesas;
  S.today.linhas = (S.today.linhas || []).concat([["Galeria: aluguéis recebidos", `M ${fmt(d.receita)}`], ["Galeria: manutenção e vagas", `-M ${fmt(d.despesas)}`]]);
}
function fimDoDiaAtacado(L) {
  const a = at(), h = a.hoje, tot = h.comerciantes;
  const d = { dia: L.day, fardos: h.fardos, receita: Math.round(h.receita), custo: Math.round(h.custo), comerciantes: tot, perdidos: h.perdidos, multas: h.multas, paletes: h.paletes };
  a.dias.unshift(d); a.dias.length = Math.min(a.dias.length, 5); L.atacado = d; a.hoje = novoHojeAt();
}

// ---------- ações ----------
function atribuirPosicao(k, d) {
  const a = at(), p = a.pos[k]; if (!p || k >= a.nPos) return;
  const opcoes = [null, ...openSectors().map(s => s.id)], i = opcoes.indexOf(p.sec), novo = opcoes[(i + d + opcoes.length) % opcoes.length];
  if (p.fardos > 0 && p.sec) { a.dep[p.sec] = (a.dep[p.sec] || 0) + Math.ceil(p.fardos / AT_CFG.palete); p.fardos = 0; }   // palete volta inteiro para o depósito (arredonda: o operador reembala)
  p.sec = novo; anunciar(`Posição ${k + 1}: ${novo ? nomeSetor(novo) : "livre"}.`); save(); lastSig = ""; renderSheet();
}

}

  else if (oque === "doca") { if (a.docas >= 2) return; if (!pagarContratacao(AT_CFG.docaCusto, "a segunda doca")) return; a.docas = 2; banner("🚛 Segunda doca aberta", "#e8711a"); }

  OB_CFG.licencas.forEach(L => { const l = o.lic[L.id]; if (l && !l.ok) { l.t += dt;

      if (o.apoio < 0.6) { l.ok = false; l.t = 0; banner("📢 Audiência pediu mais compromissos", "#b7773b"); toast("A vizinhança pediu contrapartidas. Assuma um compromisso e a audiência é refeita (sem novo custo)."); l.espera = true; }

    else if (L.id !== "audiencia" && l.t >= L.dias * DAY_LEN) { l.ok = true; banner(`✅ ${L.nome}`, "#2e7a57"); lastSig = ""; } } });
  const au = o.lic.audiencia; if (au && au.espera && o.apoio >= 0.6) au.espera = false;
  if (au && au.espera) au.t = 0;
  // obra

    if (o.chuva <= 0 && !o.embargo && S.money > 0) {
