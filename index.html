<script>
"use strict";
// =====================================================================
// Drawing
// =====================================================================
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let DPR = 1, VW = 360, VH = 640, RES = 2, camReady = false; canvasOK = true;

// ---------- camera: pan, zoom and limits ----------
// cam.x/cam.y is the world point at the centre of the screen, cam.s is CSS pixels per world unit.
const cam = { x: W / 2, y: 300, s: 1, anim: null, vx: 0, vy: 0 };
const PAD_X = 24, PAD_T = 120, PAD_B = 130;          // screen px the world edge may travel under the HUD
const STEPS = [1, 1.5, 2, 3, 4, 6, 8];
function camLimits() {
  const wb = worldBounds(), ww = wb.x1 - wb.x0, wh = wb.y1 - wb.y0;
  const base = Math.min(VW / (W + 24), (VH - 190) / 520);
  const s0 = Math.max(0.5, base);
  const min = Math.min(s0 * 0.9, Math.max(VW / (ww + 40), (VH - 200) / (wh + 40)) * 0.98, VW / (ww + 40));
  return { s0, min: Math.max(0.25, Math.min(min, s0)), max: s0 * 2.8 };
}
// screen px covered by an open sheet (bottom on phones, right on wide screens); the camera may travel that much further
const occl = { b: 0, r: 0 };
function updateOccl() {
  const sh = document.getElementById("sheet"); occl.b = occl.r = 0;
  if (sh && !sh.hidden) { const r = sh.getBoundingClientRect(); if (r.left > VW * 0.45) occl.r = VW - r.left; else occl.b = Math.max(0, VH - r.top - PAD_B); }
}
function clampedPos(x, y, s) {
  const wb = WORLD, hw = VW / 2 / s, hh = VH / 2 / s;
  const ax = wb.x0 - PAD_X / s + hw, bx = wb.x1 + (PAD_X + occl.r) / s - hw;
  const ay = wb.y0 - PAD_T / s + hh, by = wb.y1 + (PAD_B + occl.b) / s - hh;
  return { x: ax > bx ? (ax + bx) / 2 : Math.max(ax, Math.min(bx, x)), y: ay > by ? (ay + by) / 2 : Math.max(ay, Math.min(by, y)) };

  const c = clampedPos(cam.x, cam.y, cam.s);
  if (snap || cam.x !== c.x) { if (cam.x !== c.x) cam.vx = 0; cam.x = c.x; }
  if (snap || cam.y !== c.y) { if (cam.y !== c.y) cam.vy = 0; cam.y = c.y; }
}
// after a sheet closes, glide back inside the normal limits instead of jumping
function settleCam() { updateOccl(); const c = clampedPos(cam.x, cam.y, cam.s); if (Math.abs(c.x - cam.x) > .5 || Math.abs(c.y - cam.y) > .5) cam.anim = { x: c.x, y: c.y, s: cam.s }; }
function freeArea() {
  // the part of the screen not covered by HUD, bottom UI or an open sheet
  const hud = document.getElementById("hud").getBoundingClientRect(), nav = document.getElementById("nav").getBoundingClientRect();
  let top = hud.bottom + 6, bottom = nav.top - 6, right = VW;
  const sh = document.getElementById("sheet");
  if (!sh.hidden) { const r = sh.getBoundingClientRect(); if (r.left > VW * 0.45) right = r.left - 8; else bottom = Math.min(bottom, r.top - 8); }
  else { const m = document.getElementById("mission").getBoundingClientRect(); if (m.height) bottom = Math.min(bottom, m.top - 4); }
  if (bottom - top < 80) top = Math.max(0, bottom - 80);
  return { left: 0, right, top, bottom };
}
const toWorld = (sx, sy) => ({ x: cam.x + (sx - VW / 2) / cam.s, y: cam.y + (sy - VH / 2) / cam.s });
const toScreen = (wx, wy) => ({ x: (wx - cam.x) * cam.s + VW / 2, y: (wy - cam.y) * cam.s + VH / 2 });
function zoomAt(sx, sy, s) {
  const L = camLimits(), ns = Math.max(L.min, Math.min(L.max, s)), p = toWorld(sx, sy);
  cam.s = ns; cam.x = p.x - (sx - VW / 2) / ns; cam.y = p.y - (sy - VH / 2) / ns; clampCam();
}
// smooth move so that world point (wx, wy) lands at the centre of the free area
function flyTo(wx, wy, s, instant) {
  const L = camLimits(); s = Math.max(L.min, Math.min(L.max, s || cam.s));
  const f = freeArea(), fx = (f.left + f.right) / 2, fy = (f.top + f.bottom) / 2;
  const c = clampedPos(wx - (fx - VW / 2) / s, wy - (fy - VH / 2) / s, s), tx = c.x, ty = c.y;
  cam.vx = cam.vy = 0;
  if (instant) { cam.x = tx; cam.y = ty; cam.s = s; cam.anim = null; clampCam(true); }
  else cam.anim = { x: tx, y: ty, s };
}
function recenter(instant) { overview = false; camHome = null; syncMapBtn(); flyTo(W / 2, Math.min((60 + H + 80) / 2, 360), camLimits().s0, instant); }
let overview = false, beforeOverview = null, camHome = null;
function toggleOverview() {
  camHome = null;
  if (overview) { overview = false; const b = beforeOverview; if (b) cam.anim = { x: b.x, y: b.y, s: b.s }; else recenter(); }
  else { overview = true; beforeOverview = { x: cam.x, y: cam.y, s: cam.s }; flyTo((WORLD.x0 + WORLD.x1) / 2, (WORLD.y0 + WORLD.y1) / 2, camLimits().min); }
  syncMapBtn();
}
function syncMapBtn() { const b = document.getElementById("btnMap"); if (b) b.setAttribute("aria-pressed", overview); }
// keep a selected building inside the free area (only moves when it is hidden or under a panel)
function reveal(r) {
  const f = freeArea(), a = toScreen(r.x, r.y), b = toScreen(r.x + r.w, r.y + r.h), m = 16;
  if (a.x >= f.left + m && b.x <= f.right - m && a.y >= f.top + m && b.y <= f.bottom - m) return;

}
function stepCam(dt) {
  if (cam.anim) {
    const k = REDUZ() ? 1 : 1 - Math.exp(-dt * 9), A = cam.anim;      // movimento reduzido: a câmera vai direto
    cam.x += (A.x - cam.x) * k; cam.y += (A.y - cam.y) * k; cam.s += (A.s - cam.s) * k;
    if (Math.abs(A.x - cam.x) < .3 && Math.abs(A.y - cam.y) < .3 && Math.abs(A.s - cam.s) < .002) { cam.x = A.x; cam.y = A.y; cam.s = A.s; cam.anim = null; }
    clampCam();
  } else if (!drag && !REDUZ() && (Math.abs(cam.vx) > 2 || Math.abs(cam.vy) > 2)) {
    // a short glide after a fling
    cam.x -= cam.vx * dt / cam.s; cam.y -= cam.vy * dt / cam.s;
    const k = Math.exp(-dt * 5); cam.vx *= k; cam.vy *= k; clampCam();
  }
  let r = STEPS.find(v => v >= DPR * cam.s * 0.9) || 8;
  if (r !== RES) { RES = r; floorCache = null; if (Object.keys(emojiCache).length > 700) for (const k in emojiCache) delete emojiCache[k]; }
}
function fitCanvas() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  VW = cv.clientWidth || window.innerWidth; VH = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  updateOccl();
  if (!camReady) { camReady = true; recenter(true); } else clampCam(true);
}
window.addEventListener("resize", fitCanvas);
if (window.ResizeObserver) new ResizeObserver(() => { if (cv.clientWidth !== VW || cv.clientHeight !== VH) fitCanvas(); }).observe(cv);
function rrPath(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); }
function rr(x, y, w, h, r, fill) { rrPath(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function rrs(x, y, w, h, r, fill, stroke, lw = 1) { rrPath(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
function grad(y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function text(t, x, y, size, color, align = "center", weight = 800, font = "Nunito", outline) {
  ctx.font = `${weight} ${size}px "${font}", system-ui, sans-serif`; ctx.textAlign = align;
  if (outline) { ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
// Emoji are rendered once into small bitmaps so the scene stays smooth
const emojiCache = {};
function emoji(ch, x, y, size) {
  const k = ch + size + "@" + RES;
  if (!emojiCache[k]) {
    const c = document.createElement("canvas"), s = Math.max(8, Math.ceil(size * 1.5 * RES)); c.width = c.height = s;
    const g = c.getContext("2d"); g.font = `${s * 0.77}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(ch, s / 2, s / 2 + s * 0.05); emojiCache[k] = c;
  }
  ctx.drawImage(emojiCache[k], x - size * 0.75, y - size * 0.75, size * 1.5, size * 1.5);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = v => Math.round(f > 1 ? v + (255 - v) * (f - 1) / f : v * f);
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}
const now = () => performance.now() / 1000;
</script>

"use strict";
// ---------- particles: coins fly to the balance, sparkles on purchases ----------
// Os efeitos decorativos usam um sorteio próprio: ligar ou desligar "reduzir movimento" não altera
// o sorteio da simulação (clientes, compras, carros). Sem a diversidade (teste de regressão), usa o de antes.
let decorSeed = 987654321;
const rDec = () => DIV ? (decorSeed = (decorSeed * 16807) % 2147483647) / 2147483647 : Math.random();
const fx = [];
function coinBurst(x, y, n) {
  if (REDUZ()) { pulseMoney(); return; }      // movimento reduzido: sem moedas voando
  for (let i = 0; i < n; i++) fx.push({ kind: "coin", x, y, sx: x, sy: y, t: -i * 0.06, life: 0.8, ox: (rDec() - .5) * 40, oy: -20 - rDec() * 20 });
}
function sparkle(x, y, color, n = 14) {
  if (REDUZ()) return;
  for (let i = 0; i < n; i++) { const a = rDec() * Math.PI * 2, s = 30 + rDec() * 60;
    fx.push({ kind: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, t: 0, life: 0.7 + rDec() * .3, color }); }
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i]; p.t += dt;
    if (p.kind === "spark") { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; }
    if (p.kind === "conf") { p.x += (p.vx + Math.sin(p.t * 4 + p.r) * 20) * dt; p.y += p.vy * dt; }
    if (p.t > p.life) { fx.splice(i, 1); if (p.kind === "coin") pulseMoney(); }
  }
}
function drawFx() {
  for (const p of fx) {
    if (p.t < 0) continue;
    const k = p.t / p.life;
    if (p.kind === "coin" || p.kind === "conf") continue;   // drawn in screen space, see drawFxScreen
    if (p.kind === "heart") {
      ctx.globalAlpha = 1 - k; emoji("💚", p.x + p.vx * p.t, p.y - p.t * 30, 8 + k * 3); ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 6); ctx.fillRect(-2, -2, 4, 4); ctx.restore(); ctx.globalAlpha = 1;
    }
  }
}

// coins fly from the checkout to the balance in the HUD; confetti falls over the whole screen
let moneyAt = { x: 120, y: 30 };
function measureHud() { const r = document.getElementById("moneyChip").getBoundingClientRect(); moneyAt = { x: r.left + 18, y: r.top + r.height / 2 }; }
function drawFxScreen() {
  for (const p of fx) {
    if (p.t < 0) continue;
    const k = p.t / p.life;
    if (p.kind === "coin") {
      const a = toScreen(p.sx, p.sy), mx = a.x + p.ox * 1.4, my = a.y + p.oy * 1.6, e = k * k, u = 1 - k;
      const x = u * u * a.x + 2 * u * k * mx + e * moneyAt.x, y = u * u * a.y + 2 * u * k * my + e * moneyAt.y;
      const r = 8 * (1 - k * .35), sq = Math.abs(Math.cos(now() * 10 + p.ox));
      ctx.fillStyle = "#c98f17"; ctx.beginPath(); ctx.ellipse(x, y + 1.5, r * Math.max(.3, sq), r, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#f8c94a"; ctx.beginPath(); ctx.ellipse(x, y, r * Math.max(.3, sq), r, 0, 0, 7); ctx.fill();
      if (sq > .6) text("M", x, y + 4, 10, "#8a5d06", "center", 800);
    } else if (p.kind === "conf") {
      ctx.globalAlpha = Math.min(1, (p.life - p.t) * 2); ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r + p.t * 5); ctx.fillRect(-5, -2.5, 10, 5); ctx.restore(); ctx.globalAlpha = 1;
    }
  }
}

// ---------- ambient life ----------
const cars = []; let carTimer = 2;
const CAR_COLORS = ["#c9513a", "#3f74b8", "#f2b233", "#5a9a3c", "#8a5cc2", "#e6e2d8", "#2a2620"];
function updateCars(dt) {
  carTimer -= dt;
  if (carTimer <= 0) { carTimer = (2.5 + Math.random() * 4) / (SCENE.transito || 1); const right = Math.random() < .5;
    cars.push({ x: right ? WORLD.x0 - 40 : WORLD.x1 + 40, y: right ? 27 : 8, v: (right ? 1 : -1) * (70 + Math.random() * 50), color: pick(CAR_COLORS) }); }
  for (let i = cars.length - 1; i >= 0; i--) { const c = cars[i]; c.x += c.v * dt; if (c.x < WORLD.x0 - 60 || c.x > WORLD.x1 + 60) cars.splice(i, 1); }
}
function drawCars() {
  for (const c of cars) {
    const d = Math.sign(c.v), x = c.x, y = c.y;
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(x - 15, y + 5, 30, 3);
    rr(x - 15, y - 5, 30, 11, 4, c.color);
    rr(x - 7 + d * 2, y - 4, 13, 9, 3, shade(c.color, .75));
    rr(x - 5 + d * 2, y - 3, 9, 7, 2, "rgba(214,232,251,.85)");
    ctx.fillStyle = "#fff6c8"; ctx.fillRect(x + d * 14 - 1, y - 4, 2, 3); ctx.fillRect(x + d * 14 - 1, y + 2, 2, 3);
  }
}
let bannerQ = [];
function banner(txt, color = "#1f4d3a") { bannerQ.push({ txt, color, t: 0 }); }
function drawBanner(dt) {
  const b = bannerQ[0]; if (!b) return;
  if (!b.dito) { b.dito = true; anunciar(b.txt); }   // leitores de tela ouvem cada aviso uma vez
  b.t += dt; const T = 2.2;
  if (b.t > T) { bannerQ.shift(); return; }
  const k = b.t < .35 ? 1 - Math.pow(1 - b.t / .35, 3) : b.t > T - .35 ? Math.pow((T - b.t) / .35, 2) : 1;
  // screen space, just below the HUD
  const red = REDUZ(), x = red ? VW / 2 : VW / 2 + (1 - k) * (b.t < T / 2 ? -VW : VW), y = Math.min(VH * 0.42, freeTop + 70);
  ctx.save(); ctx.translate(x, y); if (red) ctx.globalAlpha = Math.min(1, k * 1.5); else ctx.rotate(-.04);
  rr(-140, -20, 280, 40, 12, "rgba(0,0,0,.18)");
  rr(-140, -23, 280, 40, 12, b.color);
  ctx.fillStyle = "rgba(255,255,255,.12)"; for (let i = -140; i < 140; i += 22) ctx.fillRect(i + (red ? 0 : (b.t * 40) % 22), -23, 8, 40);
  text(b.txt, 0, 5, 18, "#fff", "center", 800, "Baloo 2", "rgba(0,0,0,.25)");
  ctx.restore();
}

// shelves bounce the products that were just placed
const pops = SECTORS.map(() => ({ from: 0, to: 0, t: -9 }));
function markPop(i, from, to) { pops[i] = { from, to, t: now() }; }
function heart(x, y) { if (REDUZ()) return; fx.push({ kind: "heart", x, y, t: 0, life: 1.1, vx: (rDec() - .5) * 10 }); }
function confetti() {
  if (REDUZ()) return;
  const cols = ["#c9513a", "#f2b233", "#3f74b8", "#5a9a3c", "#8a5cc2", "#fffaf0"];
  for (let i = 0; i < 80; i++) fx.push({ kind: "conf", x: rDec() * VW, y: -10 - rDec() * 120, vx: (rDec() - .5) * 40, vy: 160 + rDec() * 140,
    t: 0, life: 2.4 + rDec(), color: cols[(rDec() * cols.length) | 0], r: rDec() * 6 });
}

// ---------- characters ----------
function person(p, opts = {}) {
  const { x, y } = p, t = now(), moving = opts.moving, ph = t * 13 + (p.id || 0) * 1.7;
  const bob = REDUZ() ? 0 : moving ? Math.abs(Math.sin(ph)) * -1.6 : Math.sin(t * 2 + (p.id || 0)) * .4;
  const ink = "rgba(42,32,20,.55)";
  ctx.fillStyle = "rgba(40,30,15,.18)"; ctx.beginPath(); ctx.ellipse(x, y + 10, 9.5, 3.6, 0, 0, 7); ctx.fill();
  // legs
  const s = moving ? Math.sin(ph) * 2.6 : 0;
  rr(x - 5 + s, y + 4, 4, 7, 2, "#3a3330"); rr(x + 1 - s, y + 4, 4, 7, 2, "#3a3330");
  // body
  const body = opts.body || p.shirt;
  rrPath(x - 8.5, y - 7 + bob, 17, 15, 6); ctx.fillStyle = grad(y - 7 + bob, y + 8 + bob, shade(body, 1.15), shade(body, .85)); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = .8; ctx.stroke();
  if (opts.apron) { rr(x - 5.5, y - 3 + bob, 11, 10, 3, opts.apron); rr(x - 2, y - 1 + bob, 4, 3, 1, "rgba(255,255,255,.45)"); }
  // arms
  const arm = moving && !REDUZ() ? Math.sin(ph) * 2 : 0;
  rr(x - 11, y - 4 + bob - arm, 4, 9, 2, shade(body, .9)); rr(x + 7, y - 4 + bob + arm, 4, 9, 2, shade(body, .9));
  // head
  ctx.fillStyle = p.skin || "#f2cfa6"; ctx.beginPath(); ctx.arc(x, y - 13 + bob, 7.8, 0, 7); ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = .8; ctx.stroke();
  ctx.fillStyle = p.hair || "#3b2a1a"; ctx.beginPath(); ctx.arc(x, y - 15 + bob, 7.9, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  if (p.long) { rr(x - 8, y - 15 + bob, 3.5, 9, 2, p.hair); rr(x + 4.5, y - 15 + bob, 3.5, 9, 2, p.hair); }
  if (opts.cap) { rr(x - 8.5, y - 23.5 + bob, 17, 6, 3, opts.cap); rr(x - 1, y - 20 + bob, 11, 3, 1.5, shade(opts.cap, .8)); }
  // face
  const blink = (Math.sin(t * 1.3 + (p.id || 0) * 3) > .985) ? .2 : 1.2;
  ctx.fillStyle = "#2a2620";
  ctx.beginPath(); ctx.ellipse(x - 2.8, y - 12 + bob, 1.1, blink, 0, 0, 7); ctx.ellipse(x + 2.8, y - 12 + bob, 1.1, blink, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(230,120,110,.35)"; ctx.beginPath(); ctx.arc(x - 4.8, y - 9.5 + bob, 1.6, 0, 7); ctx.arc(x + 4.8, y - 9.5 + bob, 1.6, 0, 7); ctx.fill();
  ctx.strokeStyle = "#2a2620"; ctx.lineWidth = 1; ctx.beginPath();
  if (opts.mood === "angry") ctx.arc(x, y - 6.5 + bob, 2.2, Math.PI * 1.15, Math.PI * 1.85);
  else if (opts.mood === "happy") ctx.arc(x, y - 9.5 + bob, 2.4, Math.PI * .15, Math.PI * .85);
  else { ctx.moveTo(x - 1.5, y - 8.3 + bob); ctx.lineTo(x + 1.5, y - 8.3 + bob); }
  ctx.stroke();
  // basket (shoppers) or box (staff)
  if (opts.basket) {
    ctx.strokeStyle = "#b23a2a"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(x + 13, y - 2 + bob, 6, Math.PI, 0); ctx.stroke();
    opts.basket.slice(-2).forEach((ch, i) => emoji(ch, x + 9.5 + i * 7, y - 1 + bob, 8));
    rrs(x + 5, y + 1 + bob, 16, 8, 2, "#d9533f", "#9e2f22", 1);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(x + 7, y + 3.5 + bob, 12, 1);
  }
  if (opts.cart) {
    const cx = x + 9, cy = y - 2 + bob;
    ctx.strokeStyle = "#5b6b73"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x + 5, y - 4 + bob); ctx.lineTo(cx, cy); ctx.stroke();
    rrs(cx, cy, 18, 11, 2, "rgba(220,228,232,.9)", "#5b6b73", 1.2);
    ctx.strokeStyle = "rgba(91,107,115,.5)"; ctx.lineWidth = .7; for (let k = 4; k < 18; k += 4) { ctx.beginPath(); ctx.moveTo(cx + k, cy); ctx.lineTo(cx + k, cy + 11); ctx.stroke(); }
    opts.cart.slice(-3).forEach((ch, i) => emoji(ch, cx + 4 + i * 5.5, cy + 2, 7.5));
    ctx.fillStyle = "#2a2620"; ctx.beginPath(); ctx.arc(cx + 3, cy + 13, 1.8, 0, 7); ctx.arc(cx + 15, cy + 13, 1.8, 0, 7); ctx.fill();
  }
  if (opts.stack) {
    for (let k = 0; k < Math.min(4, opts.stack); k++) rrs(x - 7, y - 2 + bob - k * 3, 14, 6, 1.5, "#d9533f", "#9e2f22", .8);
  }
  if (opts.box) {
    rrs(x - 8, y - 6 + bob, 16, 12, 2, "#c99a5b", "#8a6634", .8); rr(x - 8, y - 2 + bob, 16, 2, 0, "#a87b42");
    emoji(opts.box, x, y + 1 + bob, 6.5);
  }
}
function bubble(x, y, ch, color = "#fffaf0", pop = 1) {
  const s = pop;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.beginPath(); ctx.arc(0, 1.2, 10.5, 0, 7); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1, 8); ctx.lineTo(6, 13); ctx.lineTo(6, 6); ctx.fill();
  ctx.strokeStyle = "rgba(42,32,20,.25)"; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, 7); ctx.stroke();
  ctx.restore();

}
function patienceBar(x, y, p) {
  rr(x - 11, y, 22, 5, 2.5, "rgba(42,32,20,.35)");

<script>
"use strict";
// =====================================================================
// Vida urbana dos cenários da carreira: vizinhança desenhada no chão
// (pré-desenhada uma vez, custo zero por quadro), pedestres que passam,
// entram e saem de casas e lojas, e ônibus que para no ponto.
// No Modo Livre (cenário "esquina") nada daqui roda nem sorteia números.
// =====================================================================
const CALC_TOPO = -22;            // a calçada do outro lado da rua principal vai de -22 a 0
const PONTO_X = LOJA.letreiro.x + LOJA.letreiro.w / 2 - 8;   // ponto de ônibus, do outro lado da rua, em frente ao letreiro
const PORTAS = [];                // portas e portões do outro lado da rua (preenchido ao desenhar)

const PASTEIS = ["#f3d9a4", "#cfe3c1", "#f2c4b0", "#bcd7e8", "#f6e7c8", "#e8c6d9", "#fff1d0", "#d9e7d0", "#f4cfa0"];
const TELHAS = ["#b5533c", "#a8472f", "#c06446", "#8f8a84"];
const LOJAS = [
  { nome: "LANCHES", cor: "#d9822b" }, { nome: "MODAS", cor: "#b5487a" }, { nome: "FARMÁCIA", cor: "#2e7a57", cruz: true },
  { nome: "SALÃO", cor: "#8a5cc2" }, { nome: "ÓTICA", cor: "#3f74b8" }, { nome: "CELULARES", cor: "#4b5563" },
  { nome: "PET", cor: "#8a6a4a" }, { nome: "CALÇADOS", cor: "#c9513a" }, { nome: "PAPELARIA", cor: "#2f8a7a" },
];

// ---------- vizinhança pré-desenhada ----------
function pintarVizinhanca(g, rrg, wb, ww) {
  let seed = SCENE.semente || (SCENE.vizinhanca === "centro" ? 97 : 53);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pickR = a => a[Math.floor(rnd() * a.length)];
  const fonte = (px, peso = 800) => { g.font = `${peso} ${px}px "Nunito", system-ui, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; };
  PORTAS.length = 0;

  // calçada larga do outro lado da rua principal, com juntas
  g.fillStyle = COR().calcadaLonge; g.fillRect(wb.x0, CALC_TOPO, ww, -CALC_TOPO);
  g.fillStyle = "rgba(120,110,90,.16)"; for (let x = wb.x0; x < wb.x1; x += 16) g.fillRect(x, CALC_TOPO, 1, -CALC_TOPO);
  g.fillStyle = "rgba(0,0,0,.10)"; g.fillRect(wb.x0, -2, ww, 2);

  const base = CALC_TOPO, topo = wb.y0 + 6;
  if (SCENE.vizinhanca === "casas") {
    for (let x = wb.x0 + 4; x < wb.x1 - 40;) {
      const w = 64 + Math.floor(rnd() * 34);
      casaFrente(g, rrg, x, w, base, topo, rnd, pickR);
      x += w + 4 + Math.floor(rnd() * 8);
    }
  } else if (SCENE.vizinhanca === "rodovia") {
    // beira de rodovia: canteiro, galpões, um posto de serviço genérico e vegetação de restinga (sem marcas)
    g.fillStyle = "#a9bf7f"; g.fillRect(wb.x0, wb.y0, ww, base - wb.y0);
    for (let x = wb.x0 + 6; x < wb.x1 - 60;) {
      const w = 110 + Math.floor(rnd() * 70), h = 30 + Math.floor(rnd() * 16), cor = pickR(["#d9d4c7", "#c9cfd4", "#e2d8c0", "#cfd6c8"]);
      if (rnd() < .3) { for (let k = 0; k < 4; k++) tree(g, x + 14 + k * 24, base - 18 - rnd() * 14, 8 + rnd() * 4); x += w; continue; }
      g.fillStyle = "rgba(40,30,15,.2)"; g.fillRect(x + 3, base - h - 2, w, h);
      g.fillStyle = cor; g.fillRect(x, base - h - 5, w, h);
      g.fillStyle = shade(cor, .82); for (let k = 0; k < w; k += 10) g.fillRect(x + k, base - h - 5, 1.5, h);
      g.fillStyle = shade(cor, .7); g.fillRect(x, base - h - 5, w, 4);
      g.fillStyle = "#6b7378"; g.fillRect(x + w / 2 - 12, base - 19, 24, 14);
      x += w + 18 + Math.floor(rnd() * 20);
    }
  } else {
    g.fillStyle = "#a9a49a"; g.fillRect(wb.x0, wb.y0, ww, base - wb.y0);          // fundos dos prédios
    let academia = false;
    for (let x = wb.x0 + 2; x < wb.x1 - 40;) {
      const gym = !academia && x > 380;
      const w = gym ? 118 : 60 + Math.floor(rnd() * 34);
      predioLoja(g, rrg, x, w, base, topo, rnd, pickR, gym);
      if (gym) academia = true;
      x += w + 2;
    }
  }
  pontoOnibus(g, rrg, PONTO_X, base, fonte);
  // árvores na calçada (copas pequenas, longe do ponto)
  for (let x = wb.x0 + 40; x < wb.x1; x += SCENE.vizinhanca === "centro" ? 150 : 110) {
    if (Math.abs(x - PONTO_X) < 40) continue;
    g.fillStyle = "#8a7a5c"; g.fillRect(x - 5, -9, 10, 4);
    tree(g, x, -14, 7.5);
  }

  // laterais e fundos: vista de cima (telhados, quintais, lajes)
  const quadras = [
    [wb.x0, wb.y0, (SCENE.doca ? -170 : -72) - wb.x0, (H + 62) - wb.y0],   // esquerda (com doca, termina antes dela)
    [W + (SCENE.plot ? 192 : SCENE.faixaDir || 76), wb.y0, wb.x1 - (W + (SCENE.plot ? 192 : SCENE.faixaDir || 76)), (H + 62) - wb.y0],   // direita (galeria do atacarejo: mais afastada)
    [wb.x0, H + 126, ww, wb.y1 - (H + 126)],                        // fundos, depois da rua de baixo
  ];
  quadras.forEach(([qx, qy, qw, qh], qi) => {
    if (qw < 30 || qh < 30) return;
    const y0 = qi < 2 ? Math.max(qy, 2) + 40 : qy + 4;              // nas laterais, começa abaixo da rua principal
    for (let y = y0; y < qy + qh - 30; y += 66) for (let x = qx + 4; x < qx + qw - 30; x += 74)
      telhado(g, rrg, x, y, Math.min(68, qx + qw - x - 4), Math.min(60, qy + qh - y - 4), rnd, pickR);
  });
}

function casaFrente(g, rrg, x, w, base, topo, rnd, pickR) {
  const parede = pickR(PASTEIS), alt = 30 + Math.floor(rnd() * 10), muroH = 13;
  const yCasa = base - muroH - alt + 4;
  // quintal visto por cima do muro
  g.fillStyle = "#a9c47c"; g.fillRect(x, topo, w, base - topo);
  if (rnd() < .55) tree(g, x + 10 + rnd() * (w - 20), topo + 12 + rnd() * 10, 8 + rnd() * 4);   // árvore no fundo do quintal
  // corpo da casa
  g.fillStyle = "rgba(40,30,15,.18)"; g.fillRect(x + 7, yCasa + 3, w - 10, alt);
  g.fillStyle = parede; g.fillRect(x + 5, yCasa, w - 10, alt);
  // telhado: duas águas de telha, ou laje com caixa d'água
  if (rnd() < .62) {
    const tc = pickR(TELHAS);
    g.fillStyle = tc; g.beginPath(); g.moveTo(x + 1, yCasa + 2); g.lineTo(x + w / 2, yCasa - 16); g.lineTo(x + w - 1, yCasa + 2); g.closePath(); g.fill();
    g.strokeStyle = shade(tc, .75); g.lineWidth = 1; for (let k = 1; k < 5; k++) { g.beginPath(); g.moveTo(x + 1 + k * 3, yCasa + 2 - k * 3.4); g.lineTo(x + w - 1 - k * 3, yCasa + 2 - k * 3.4); g.stroke(); }
  } else {
    g.fillStyle = "#b9b4aa"; g.fillRect(x + 3, yCasa - 4, w - 6, 5);
    const cx = x + 12 + rnd() * (w - 34);
    g.fillStyle = "#3f74b8"; rrg(cx, yCasa - 15, 14, 11, 3); g.fill(); g.fillStyle = "#5b8fd0"; g.fillRect(cx + 2, yCasa - 14, 10, 2);
  }
  // janelas com grade
  const nj = w > 80 ? 2 : 1;
  for (let k = 0; k < nj; k++) {
    const jx = x + (nj === 1 ? w / 2 + 6 : 14 + k * (w - 40)), jy = yCasa + 6;
    g.fillStyle = "#7fa9c4"; g.fillRect(jx, jy, 14, 11); g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(jx + 1, jy + 1, 5, 9);
    g.fillStyle = "rgba(60,50,40,.7)"; for (let b = 3; b < 14; b += 3.5) g.fillRect(jx + b, jy, .8, 11);
  }
  // muro e portão (o portão vira porta para os pedestres que moram ali)
  const muro = rnd() < .5 ? "#f2eee4" : shade(parede, .92);
  g.fillStyle = muro; g.fillRect(x, base - muroH, w, muroH);

function vistaMundo() { const a = toWorld(-30, -40), b = toWorld(VW + 30, VH + 40); return { x0: a.x, y0: a.y, x1: b.x, y1: b.y }; }

// camada 0: calçada de lá e ônibus (atrás dos carros); camada 1: meio-fio do lado do mercado (na frente)
function drawCidade(camada) {

"use strict";
// =====================================================================
// Input: drag to pan, pinch or wheel to zoom, tap to select.
// A gesture that moved more than a few pixels never counts as a tap, so panning cannot buy or select anything.
// =====================================================================
const ptrs = new Map(); let drag = null, pinch = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
cv.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
cv.addEventListener("pointerdown", ev => {

  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.max(10, dist(a, b)), s: cam.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; if (drag) drag.moved = true; }

  p.x = ev.clientX; p.y = ev.clientY;
  if (ptrs.size >= 2 && pinch) {
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.x -= (mx - pinch.mx) / cam.s; cam.y -= (my - pinch.my) / cam.s; pinch.mx = mx; pinch.my = my;
    zoomAt(mx, my, pinch.s * dist(a, b) / pinch.d); camHome = null;
    if (overview) { overview = false; syncMapBtn(); }
    return;
  }
  if (drag && ev.pointerId === drag.id) {
    const dx = ev.clientX - drag.lx, dy = ev.clientY - drag.ly, tn = performance.now();
    if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > drag.slop) { drag.moved = true; camHome = null; cv.classList.add("dragging"); }
    if (drag.moved) {
      cam.x -= dx / cam.s; cam.y -= dy / cam.s; clampCam();
      const dt = Math.max(8, tn - drag.lt);
      cam.vx = cam.vx * .5 + dx / dt * 1000 * .5; cam.vy = cam.vy * .5 + dy / dt * 1000 * .5;
      drag.lt = tn;
      if (overview) { overview = false; syncMapBtn(); }
    }
    drag.lx = ev.clientX; drag.ly = ev.clientY;

<script>
"use strict";
// =====================================================================
// Acessibilidade para quem joga:
// - Lista de construções e serviços em HTML: seleciona setores, caixas, cestas, depósito, fachada,
//   estacionamento e terrenos sem tocar no cenário; abre os mesmos painéis e ações do toque.
// - Teclado: setas movem a câmera, + e − aproximam/afastam, 0 recentraliza, L abre a lista,
//   Esc fecha painel ou janela e devolve o foco a quem abriu.
// - Botões de zoom e enquadramento sem gestos; preferências de movimento reduzido e texto maior.
// - Avisos para leitores de tela só em eventos (compras, avisos, fim do dia), nunca a cada moeda.
// =====================================================================

// ---------- avisos para leitores de tela ----------
let ultimoAviso = { txt: "", t: 0 };
function anunciar(txt) {
  const el = document.getElementById("anuncio"); if (!el || !txt) return;
  const t = performance.now(); if (txt === ultimoAviso.txt && t - ultimoAviso.t < 4000) return;
  ultimoAviso = { txt, t };
  el.textContent = ""; setTimeout(() => { el.textContent = String(txt).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]️?/gu, "").trim(); }, 60);
}

// ---------- zoom e enquadramento sem gestos ----------
function zoomPasso(f) {
  const a = freeArea(); cam.anim = null; cam.vx = cam.vy = 0; camHome = null;
  zoomAt((a.left + a.right) / 2, (a.top + a.bottom) / 2, cam.s * f);
  if (overview) { overview = false; syncMapBtn(); }
}
function moverCamera(dx, dy) {
  cam.anim = null; cam.vx = cam.vy = 0; camHome = null;
  cam.x += dx / cam.s; cam.y += dy / cam.s; clampCam();
  if (overview) { overview = false; syncMapBtn(); }
}
function abrirLista() { if (ui.sheet === "lista") closeSheet(); else openSheet("lista"); }
$("btnLista").onclick = () => abrirLista();
$("btnMais").onclick = () => zoomPasso(1.3);
$("btnMenos").onclick = () => zoomPasso(1 / 1.3);

// ---------- teclado ----------
function botaoEscModal() {
  const d = $("dialog"), bs = d.querySelectorAll("button");
  return d.querySelector("[data-esc], #nao, #later, #ok") || (bs.length === 1 ? bs[0] : null);
}
document.addEventListener("keydown", e => {
  const modal = !$("modal").hidden;
  if (modal) {
    if (e.key === "Escape") { const b = botaoEscModal(); if (b) { e.preventDefault(); b.click(); } return; }
    if (e.key === "Tab") {                              // o foco não sai da janela aberta
      const f = [...$("dialog").querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (document.getElementById("menu") || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t.closest && t.closest("#sheet")) return;     // dentro do painel, as setas rolam o painel
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const passo = 70, k = e.key;
  if (k === "ArrowLeft") moverCamera(-passo, 0); else if (k === "ArrowRight") moverCamera(passo, 0);
  else if (k === "ArrowUp") moverCamera(0, -passo); else if (k === "ArrowDown") moverCamera(0, passo);
  else if (k === "+" || k === "=") zoomPasso(1.3); else if (k === "-" || k === "_") zoomPasso(1 / 1.3);
  else if (k === "0") recenter(); else if (k === "l" || k === "L") abrirLista();
  else return;
  e.preventDefault();
});

// ---------- lista de construções e serviços ----------
function listaRow(ic, bg, titulo, subFn, sel, estadoFn) {
  const r = el("button", "row", `<div class="ic" style="background:${bg}" aria-hidden="true">${ic}</div><div><div class="t"></div><div class="s"></div></div><div class="go"></div>`);
  r.querySelector(".t").textContent = titulo;
  const s = r.querySelector(".s"), go = r.querySelector(".go");
  live(() => { s.textContent = subFn(); const e = estadoFn ? estadoFn() : null; go.textContent = e || "Abrir"; r.classList.toggle("locked", e === "Fechado" || e === "À venda" || e === "Bloqueado"); });
  r.onclick = () => select(sel, "lista");
  return r;
}

    const dentro = customers.filter(c => c.state !== "outside" && c.state !== "gone").length;
    const filas = LANES.slice(0, nCaixas()).map((_, l) => { const q = laneQueue(l), p = DIV ? q.filter(c => nivelPrio(c) > 0 && l === caixaPrio()).length : 0;
      return `caixa ${l + 1}: ${q.length} na fila${p ? ` (${p} com prioridade)` : ""}`; }).join("; ");
    const aj = DIV ? customers.filter(c => c.ajuda && c.ajuda.estado === "pedindo").length : 0;
    rs.querySelector("#lsResumo").textContent = `${dentro} cliente${dentro === 1 ? "" : "s"} na loja. ${filas}.${aj ? ` ${aj} pedido${aj > 1 ? "s" : ""} de ajuda aguardando.` : ""} Vagas ocupadas: ${occupied()} de ${STALLS.length}.`;
  });
  body.appendChild(rs);
  body.appendChild(el("div", "sec-title", "Setores"));
  SHELVES.forEach((sh, i) => { const d = SECTORS[i], st = S.sec[d.id];
    body.appendChild(listaRow(d.ic, shade(d.color, 1.8), d.name, () => st.open ? `Prateleira ${st.shelf} de ${shelfCap(st.shelfLvl)} · depósito ${st.wh}` : `Fechado · abrir por M ${fmt(custoAbrir(d))}`,
      { kind: "shelf", i }, () => st.open ? (st.shelf === 0 ? "Vazia" : "Abrir") : "Fechado")); });
  body.appendChild(el("div", "sec-title", "Caixas"));
  LANES.forEach((_, l) => body.appendChild(listaRow("🧾", "#d6ead9", `Caixa ${l + 1}`,
    () => l >= nCaixas() ? "Fechado: contrate um operador" : `${laneQueue(l).length} na fila${DIV && l === caixaPrio() ? (S.cashiers > 1 ? " · caixa prioritário" : " · aplica a prioridade na fila") : ""}`,
    { kind: "lane", l }, () => l >= nCaixas() ? "Fechado" : "Abrir")));
  body.appendChild(el("div", "sec-title", "Loja e serviços"));
  body.appendChild(listaRow("🧺", "#fde2dc", "Cestas e carrinhos", () => `${ENT2 ? `Entrada do estacionamento: ${station.b} cestas e ${station.c} carrinhos; entrada da avenida: ${station2.b} cestas e ${station2.c} carrinhos` : `Na entrada: ${station.b} cestas e ${station.c} carrinhos`} · ${S.gear.collectors} carrinheiro${S.gear.collectors > 1 ? "s" : ""}`, { kind: "station" }));
  body.appendChild(listaRow("📦", "#e8dcc4", "Depósito", () => `${whUsed()} de ${whCap(S.whLvl)} caixas · nível ${S.whLvl + 1}`, { kind: "wh" }));
  body.appendChild(listaRow("📣", "#f6e3c4", "Fachada e gerência", () => `Propaganda nível ${S.adsLvl} · gerente ${S.mgrLvl ? "nível " + S.mgrLvl : "nenhum"}`, { kind: "sign" }));
  if (GANCHOS.lista) GANCHOS.lista(body);                                    // capítulos 5 e 6: expedição, atacado, docas, galeria
  body.appendChild(listaRow("🅿️", "#dfe8f4", "Estacionamento", () => `${occupied()} de ${STALLS.length} vagas ocupadas · ${inQ.length} aguardando`, { kind: "parking" }));
  if (SCENE.plot) body.appendChild(listaRow("🏗️", "#fff1c9", "Terreno de expansão", () => TIERS[S.tier + 1] ? `Próximo porte: ${TIERS[S.tier + 1].name}` : "Filiais", { kind: "expand" }));
  const lotes = LOTS.filter(L => L.cost > 0);
  if (lotes.length) {
    body.appendChild(el("div", "sec-title", "Terrenos"));
    lotes.forEach(L => body.appendChild(listaRow(L.kind === "park" ? "🅿️" : L.kind === "logi" ? "🚚" : "🏗️", "#e4ece6", L.name,
      () => owns(L.id) ? (building[L.id] > 0 ? "Em obra" : "Comprado") : `${lotBenefit(L)} · M ${fmt(L.cost)}`,
      { kind: "lot", id: L.id }, () => owns(L.id) ? "Seu" : lotReqs(L).some(q => !q.ok) ? "Bloqueado" : "À venda")));
  }
  body.appendChild(el("p", "note", "Atalhos de teclado: setas movem o cenário, + e − mudam o zoom, 0 recentraliza, L abre esta lista e Esc fecha o painel."));
}

// ---------- painel do caixa: atendimento prioritário ----------
function cartaoPrioridade(body, l) {
  const a = acess(), card = el("div", "card");
  const um = () => S.cashiers <= 1, eh = () => l === caixaPrio();
  card.appendChild(el("h3", "", "Atendimento prioritário"));
  const exp = el("p", "note"); card.appendChild(exp);
  live(() => {
    exp.textContent = l >= S.cashiers ? "Caixa fechado." : um()
      ? "Com um só caixa, ele atende todos e chama primeiro quem tem prioridade. Quem já está sendo atendido nunca é interrompido."
      : eh() ? "Este é o caixa prioritário (placa azul). Quem tem prioridade vem para cá e passa à frente; quando não há prioridade esperando, atende os demais."
        : `O caixa prioritário é o Caixa ${caixaPrio() + 1}. Este caixa atende por ordem de chegada.`;
  });
  card.appendChild(statsBox([
    ["Prioridade na fila", () => { const q = laneQueue(caixaPrio()); return `${q.filter(c => nivelPrio(c) > 0).length} de ${q.length}`; }],
    ["Atendidos com prioridade hoje", () => String(a.hoje.prio)],
    ["Ajudas da equipe hoje", () => `${a.hoje.ajudas}${a.hoje.semAjuda ? ` · ${a.hoje.semAjuda} sem ajuda` : ""}`],
  ]));
  if (!um() && l < S.cashiers) {
    const b = el("button", "plain toggle", `<span></span>`);
    live(() => { const on = eh(); b.setAttribute("aria-pressed", String(on)); b.firstChild.textContent = on ? "✓ Este é o caixa prioritário" : "Tornar este o caixa prioritário"; });
    b.onclick = () => { if (!eh()) { a.caixaPrio = l; save(); lastSig = ""; renderSheet(); toast(`Caixa ${l + 1} agora é o prioritário. Quem já está na fila de outro caixa continua nela.`); } };
    card.appendChild(b);
  }
  const cb = el("button", "plain toggle", `<span></span>`);
  live(() => { cb.setAttribute("aria-pressed", String(a.cortesiaBebe)); cb.firstChild.textContent = `${a.cortesiaBebe ? "✓ Ligada" : "Desligada"}: cortesia para quem está com bebê no carrinho`; });
  cb.onclick = () => { a.cortesiaBebe = !a.cortesiaBebe; save(); renderSheet(); toast(a.cortesiaBebe ? "Cortesia ligada: vem depois das prioridades legais." : "Cortesia desligada."); };
  card.appendChild(cb);
  const det = el("details", "regras", `<summary>Quem tem prioridade no jogo</summary>
    <ul>
      <li><b>Prioridade legal</b>: pessoas com deficiência, com transtorno do espectro autista, pessoas idosas (60 anos ou mais), gestantes, lactantes, pessoas com criança de colo e pessoas com mobilidade reduzida (Lei 10.048/2000, art. 1º; Lei 13.146/2015, art. 9º).</li>
      <li>Entre as pessoas idosas, quem tem <b>80 anos ou mais</b> passa à frente das demais pessoas idosas (Lei 10.741/2003, art. 3º, §2º). Não passa à frente de outras prioridades.</li>
      <li>Ninguém é interrompido: a prioridade vale para o <b>próximo</b> atendimento. Na mesma categoria, vale a ordem de chegada.</li>
      <li><b>Carrinho de bebê</b> não aparece nessas leis ("criança de colo" não é definida). No jogo é uma cortesia opcional da loja, que vem depois das prioridades legais.</li>
      <li>A prioridade é um dado da pessoa, não da aparência: há prioridades que não aparecem e pessoas de aparência idosa com menos de 60 anos. Quem tem direito escolhe se usa.</li>
      <li>Simplificação do jogo: um cliente sem prioridade é ultrapassado no máximo ${MAX_ULTRAPASSAGENS} vezes, para ninguém ficar esquecido.</li>
    </ul><p class="note">Resumo para o jogo, não é orientação jurídica. Leis estaduais e municipais não foram consideradas.</p>`);
  card.appendChild(det);
  body.appendChild(card);
}

// ---------- configurações de acessibilidade ----------
function opcoesAcess(body) {
  body.appendChild(el("div", "sec-title", "Acessibilidade"));
  const mk = (rot, chave, desc) => {
    const b = el("button", "plain toggle", `<span></span>`);
    const pintar = () => { b.setAttribute("aria-pressed", String(!!PREFS[chave])); b.firstChild.textContent = `${PREFS[chave] ? "✓ Ligado" : "Desligado"}: ${rot}`; };
    b.onclick = () => { PREFS[chave] = !PREFS[chave]; salvarPrefs(); pintar(); requestAnimationFrame(measureHudBox); anunciar(`${rot}: ${PREFS[chave] ? "ligado" : "desligado"}`); };
    pintar(); body.appendChild(b); if (desc) body.appendChild(el("p", "note", desc));
  };
  mk("reduzir movimento", "movReduzido", "Tira confetes, brilhos, balanços e deslizes de câmera. A velocidade do jogo não muda.");
  mk("texto maior", "textoGrande", "Aumenta os textos dos painéis, da barra inferior e do topo.");
  const lb = el("button", "plain", `<span>Lista de construções e serviços (tecla L)</span>`);
  lb.onclick = () => openSheet("lista"); body.appendChild(lb);
  body.appendChild(el("p", "note", "Teclado: Tab percorre os botões, setas movem o cenário, + e − mudam o zoom, 0 recentraliza, L abre a lista e Esc fecha o painel ou a janela aberta."));
}
</script>
<script>
"use strict";
// =====================================================================
// Mapa da carreira: esquema (não é mapa real) com as lojas em ordem, região
// e distância aproximada entre cada par. Mesmos destinos e estados numa lista
// em HTML (acessível por teclado e leitor de tela); o desenho é só visual.
// Ações: assumir o próximo mercado, administrar uma loja concluída (com o
// último registro dela), reabrir loja sem estado guardado, continuar aqui.
// Distâncias são estimativas do jogo, marcadas como tal.
// =====================================================================
const MAPA_NOS = [            // rot: onde fica o nome (cima, baixo ou esq), para não cobrir linhas nem distâncias
  { id: "bairro", cap: 1, regiao: "Itapeba", curto: "Lagoa", x: 34, y: 150, rot: "baixo" },
  { id: "centro", cap: 2, regiao: "Centro", curto: "Espiga", x: 88, y: 102, rot: "cima" },
  { id: "ipe", cap: 3, regiao: "Centro", curto: "Ipê", x: 140, y: 160, rot: "baixo" },
  { id: "restinga", cap: 4, regiao: "Centro", curto: "Restinga", x: 192, y: 102, rot: "cima" },
  { id: "pitanga", cap: 5, regiao: "Centro", curto: "Pitanga", x: 244, y: 160, rot: "baixo" },
  { id: "cajueiro", cap: 6, regiao: "RJ-106", curto: "Cajueiro", x: 300, y: 62, rot: "esq" },
  { id: "brisa", cap: 7, regiao: "Centro", curto: "Brisa", x: 320, y: 132, rot: "baixo" },
  { id: "grande", cap: 8, regiao: "Orla (fictícia)", curto: "Grande", x: 252, y: 214, rot: "esq" },
];
// distância aproximada do anterior até esta loja (adaptação para o jogo, não medida em mapa: sempre estimativa)
const MAPA_DIST = { centro: "≈ 3 km", ipe: "≈ 600 m", restinga: "≈ 400 m", pitanga: "≈ 700 m", cajueiro: "≈ 6 km", brisa: "≈ 5 km", grande: "≈ 4 km" };
const nomeNo = n => FASE_CFG[n.id] ? FASE_CFG[n.id].titulo : `Capítulo ${n.cap}`;
function estadoNo(n) {
  if (n.dev || !FASE_CFG[n.id]) return { id: "dev", txt: "Bloqueada · em desenvolvimento", ic: "🔒" };
  const conc = CARREIRA.fases[n.id] && CARREIRA.fases[n.id].concluida;
  if (conc) return { id: "concluida", txt: "Concluída", ic: "✅" };
  if (n.id === CARREIRA.fase) return { id: "andamento", txt: "Em administração · capítulo em andamento", ic: "🏪" };
  if (n.id === proximaDisponivel()) return { id: "disponivel", txt: "Próxima etapa disponível", ic: "⭐" };
  return { id: "bloqueada", txt: "Bloqueada", ic: "🔒" };
}
function requisitoNo(n) {
  if (n.dev || !FASE_CFG[n.id]) return `O capítulo ${n.cap} ainda está em desenvolvimento. Ele aparece aqui para mostrar o caminho da carreira.`;
  const ant = MAPA_NOS.find(x => x.cap === n.cap - 1);
  return ant ? `Para desbloquear, conclua o capítulo ${ant.cap}: ${nomeNo(ant)}.` : "";
}
// último registro de uma loja: a loja aberta usa o estado ao vivo; as outras, o que foi salvo nelas
function registroLoja(id) {
  const L = id === FASE ? S : CARREIRA.lojas[id]; if (!L) return null;
  const sec = L.sec || {}, abertos = Object.values(sec).filter(x => x.open);
  const estoque = abertos.reduce((a, x) => a + (x.wh || 0) + (x.shelf || 0), 0);
  const equipe = abertos.reduce((a, x) => a + (x.staff || 0), 0) + (L.cashiers || 0) + ((L.gear && L.gear.collectors) || 0) + ((L.park && L.park.staff) || 0);
  const pend = L.forn && L.forn.pedidos ? L.forn.pedidos.length : 0;
  return { saldo: L.money || 0, estoque, equipe, rep: L.rep || 0, dia: L.day || 1, ultimo: L.lastDay || null, quando: id === FASE ? Date.now() : L.lastSeen, pend, reaberta: !!L.reaberta };
}
const dataHora = t => { if (!t) return "data desconhecida"; const d = new Date(t); return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} às ${String(d.getHours()).padStart(2, "0")}h${String(d.getMinutes()).padStart(2, "0")}`; };
const moeda = v => `${v < 0 ? "−" : ""}M ${fmt(Math.abs(v))}`;

// nome do ponto e, na loja aberta, o aviso "você está aqui" do mesmo lado (sem cobrir as distâncias)
function rotuloNo(n, aqui) {
  const nome = `${n.cap}. ${n.dev ? "em breve" : n.curto}`, txt = (x, y, t, a, cor, tam) => `<text x="${x}" y="${y}" font-size="${tam}" font-weight="800" text-anchor="${a}" fill="${cor}">${t}</text>`;
  const V = "VOCÊ ESTÁ AQUI", R = "#c9302c";
  if (n.rot === "cima") return txt(n.x, n.y - 19, nome, "middle", "#2a2620", 8) + (aqui ? `<path d="M${n.x} ${n.y - 28} l-5 -8 h10 z" fill="${R}"/>` + txt(n.x, n.y - 40, V, "middle", R, 7.5) : "");
  if (n.rot === "esq") return txt(n.x - 18, n.y + 3, nome, "end", "#2a2620", 8) + (aqui ? txt(n.x - 18, n.y + 13, "◀ " + V, "end", R, 7) : "");
  return txt(n.x, n.y + 24, nome, "middle", "#2a2620", 8) + (aqui ? txt(n.x, n.y + 34, "▲ " + V, "middle", R, 7) : "");
}
function svgMapa(sel) {
  const nos = MAPA_NOS, linhas = [];
  for (let i = 1; i < nos.length; i++) {
    const a = nos[i - 1], b = nos[i], dev = b.dev, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    linhas.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${dev ? "#9aa39c" : "#1f4d3a"}" stroke-width="3" stroke-dasharray="${dev ? "4 5" : "7 4"}" stroke-linecap="round"/>
      <rect x="${mx - 21}" y="${my - 6}" width="42" height="12" rx="6" fill="#fffcf4" stroke="#d6cdb3"/><text x="${mx}" y="${my + 3}" font-size="7.5" font-weight="800" text-anchor="middle" fill="#3b352a">${MAPA_DIST[b.id] || ""}</text>`);
  }
  const marcas = nos.map(n => {
    const e = estadoNo(n), aqui = n.id === FASE && !n.dev, s = n.id === sel;
    const cor = { concluida: "#2e7a57", andamento: "#f2b233", disponivel: "#3f74b8", bloqueada: "#8d877a", dev: "#8d877a" }[e.id];
    return `<g class="no-mapa" data-id="${n.id}" style="cursor:pointer">
      ${s ? `<circle cx="${n.x}" cy="${n.y}" r="18" fill="none" stroke="#f2b233" stroke-width="3"/>` : ""}
      <circle cx="${n.x}" cy="${n.y}" r="13" fill="${cor}" stroke="#fff" stroke-width="2.5"/>
      <text x="${n.x}" y="${n.y + 4.5}" font-size="12" text-anchor="middle">${e.ic}</text>
      ${rotuloNo(n, aqui)}
    </g>`;
  }).join("");
  // esquema: lagoa, mar e rodovia só como ambientação, fora de escala
  return `<svg viewBox="0 0 360 240" class="mapa-svg" aria-hidden="true" focusable="false">
    <rect width="360" height="240" rx="12" fill="#e9eedd"/>
    <path d="M0 226 C 70 214, 150 236, 220 224 S 330 214, 360 222 L360 240 L0 240 Z" fill="#a9d1e6"/>
    <text x="344" y="236" font-size="8" fill="#3c6f8a" font-weight="700" text-anchor="end">litoral</text>
    <ellipse cx="36" cy="72" rx="30" ry="13" fill="#bcdcea"/><text x="36" y="75" font-size="7.5" fill="#3c6f8a" font-weight="700" text-anchor="middle">lagoa</text>
    <path d="M0 34 C 120 44, 240 22, 360 32" stroke="#c7bf9f" stroke-width="7" fill="none"/><text x="200" y="22" font-size="7.5" fill="#6e6650" font-weight="700" text-anchor="end">rodovia (RJ-106)</text>
    <rect x="66" y="74" width="276" height="122" rx="16" fill="#dfe4d0" stroke="#c9cfb6" stroke-dasharray="3 3"/><text x="334" y="190" font-size="7.5" fill="#6e6650" font-weight="800" text-anchor="end">CENTRO</text>
    ${linhas.join("")}${marcas}
  </svg>`;
}

let mapaSel = null;
function abrirMapa(sel) {
  if (!NA_CARREIRA) return;
  closeSheet();
  mapaSel = sel && MAPA_NOS.some(n => n.id === sel) ? sel : (proximaDisponivel() || FASE);
  const disp = proximaDisponivel(); if (disp) { CARREIRA.convites[disp] = CARREIRA.convites[disp] || Date.now(); save(); }
  desenharMapa();
}
function desenharMapa() {
  const n = MAPA_NOS.find(x => x.id === mapaSel) || MAPA_NOS[0];
  const lista = MAPA_NOS.map((m, i) => { const e = estadoNo(m), dist = i ? `${MAPA_DIST[m.id] || ""} do anterior (estimativa)` : "ponto de partida";
    return `<li><button class="plain no-lista${m.id === mapaSel ? " toggle" : ""}" data-id="${m.id}" aria-pressed="${m.id === mapaSel}">
      <span class="ic-estado" aria-hidden="true">${e.ic}</span><span><b>Capítulo ${m.cap}: ${m.dev ? "em desenvolvimento" : nomeNo(m)}</b><small>${m.dev ? "" : m.regiao + " · "}${e.txt}${m.id === FASE && !m.dev ? " · você está aqui" : ""} · ${dist}</small></span></button></li>`; }).join("");
  showModal(`<h2>Mapa da carreira</h2>
    <p class="note" style="margin-top:-2px">Esquema fora de escala. Distâncias aproximadas são estimativas do jogo.</p>
    <div class="mapa-wrap">${svgMapa(mapaSel)}</div>
    <p class="legenda" aria-hidden="true"><span>🏪 em administração</span><span>✅ concluída</span><span>⭐ disponível</span><span>🔒 bloqueada</span></p>
    <div class="mapa-detalhe" id="mapaDet" aria-live="polite">${detalheNo(n)}</div>
    <h3 style="margin:12px 0 4px">Todas as lojas</h3>
    <ul class="lista-mapa">${lista}</ul>
    <button class="plain" id="ok" data-esc style="margin-top:8px;width:100%;justify-content:center"><span>Fechar o mapa</span></button>`);
  const d = document.getElementById("dialog"); d.classList.add("dialog-mapa");
  d.querySelectorAll(".no-mapa, .no-lista").forEach(b => b.addEventListener("click", () => { mapaSel = b.dataset.id; desenharMapa(); if (b.classList.contains("no-lista")) setTimeout(() => { const nb = document.querySelector(`.no-lista[data-id="${mapaSel}"]`); if (nb) nb.focus(); }, 40); }));
  ligarAcoesMapa(n);
  document.getElementById("ok").onclick = () => { d.classList.remove("dialog-mapa"); hideModal(); };
}
function detalheNo(n) {
  const e = estadoNo(n), cfg = FASE_CFG[n.id];
  const topo = `<h3>${e.ic} Capítulo ${n.cap}: ${n.dev ? "em desenvolvimento" : nomeNo(n)}</h3><p class="note">${n.dev ? "" : n.regiao + " · "}${e.txt}${n.id === FASE && !n.dev ? " · <b>você está aqui</b>" : ""}</p>`;
  if (e.id === "dev" || e.id === "bloqueada") return `${topo}<p class="note">🔒 ${requisitoNo(n)}</p>`;
  if (e.id === "disponivel") {
    return `${topo}<p>Os responsáveis pelo ${cfg.titulo} querem que você assuma a administração. ${cfg.resumo}</p>${previaSvg(n.id)}
      <p><b>Novas responsabilidades:</b> ${cfg.convite.responsabilidades}</p><p><b>O ${cfg.titulo} começa com:</b> ${cfg.convite.comeca}</p>
      <p><b>Vai com você:</b> experiência, reputação da carreira (${String(CARREIRA.repCarreira || 0).replace(".", ",")} ★) e conquistas. <b>Cada loja fica com o próprio caixa, estoque e equipe;</b> você pode voltar a elas pelo mapa.</p>
      <button class="btn" id="mAssumir">Assumir o novo mercado</button>
      <button class="plain" id="mFicar" style="margin-top:8px;width:100%;justify-content:center"><span>Continuar no ${CFG.titulo} por enquanto</span></button>`;
  }
  const r = registroLoja(n.id);
  if (!r) return `${topo}<p>A versão anterior do jogo não guardava o estado desta loja depois da conclusão. O registro do capítulo continua: concluído no dia ${CARREIRA.fases[n.id] ? CARREIRA.fases[n.id].dia : "?"}.</p>
      <p class="note">Ao reabrir, a loja começa com um estado compatível com a fase concluída: ${cfg.reaberturaTxt}. XP e conquistas não são concedidos de novo.</p>
      <button class="btn" id="mReabrir">Reabrir loja</button>`;
  const ult = r.ultimo ? `${moeda(r.ultimo.net)} no dia ${r.ultimo.day}` : "nenhum dia fechado";
  const stats = `<div class="stats"><div class="stat"><small>Saldo</small><b>${moeda(r.saldo)}</b></div><div class="stat"><small>Estoque</small><b>${fmt(r.estoque)} un.</b></div>
    <div class="stat"><small>Equipe</small><b>${r.equipe} pessoas</b></div><div class="stat"><small>Reputação</small><b>${r.rep.toFixed(1).replace(".", ",")} ★</b></div>
    <div class="stat"><small>Último resultado</small><b>${ult}</b></div>${r.pend ? `<div class="stat"><small>Pedidos a caminho</small><b>${r.pend}</b></div>` : ""}</div>`;
  if (n.id === FASE) return `${topo}${stats}<p class="note">Dados de agora (dia ${r.dia}).</p><button class="btn" id="mFicar">Continuar aqui</button>`;
  return `${topo}${stats}<p class="note">Registrado em ${dataHora(r.quando)}, no dia ${r.dia} da loja. Ao entrar, o tempo fora é processado uma vez pelo gerente, dentro do limite dele.</p>
    <button class="btn" id="mAdmin">Administrar loja</button>`;
}
function ligarAcoesMapa(n) {
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  const fechar = () => { document.getElementById("dialog").classList.remove("dialog-mapa"); hideModal(); };
  on("mAssumir", () => { fechar(); assumirProxima(); });
  on("mFicar", () => { fechar(); const nx = proximaDisponivel(); if (nx && n.id === nx) toast(`O convite continua no mapa (aba Carreira).`); });
  on("mAdmin", () => { fechar(); trocarLoja(n.id); });
  on("mReabrir", () => { fechar(); trocarLoja(n.id); });
}

// ---------- ao chegar numa loja pelo mapa: resumo da operação ----------
function lerTroca() {

}

  const fora = o ? `<table><tr><td>Tempo fora</td><td>${o.away >= 3600 ? Math.floor(o.away / 3600) + "h" + String(Math.floor(o.away % 3600 / 60)).padStart(2, "0") : Math.floor(o.away / 60) + " min"}</td></tr>

    <p class="note">As finanças desta loja são separadas das outras.</p>

<script>

function fmt(v) {
  v = Math.max(0, v);
  if (v < 1000) { const r = Math.round(v * 100) / 100; return (Number.isInteger(r) ? String(r) : r.toFixed(2)).replace(".", ","); }
  const u = ["", "mil", "mi", "bi", "tri", "quatri"]; let i = 0;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return v.toFixed(v < 10 ? 2 : 1).replace(".", ",") + " " + u[i];
}

}

}
let last = performance.now(), hudT = 0, saveT = 0, dayCheckT = 0;

}

    <p>A moeda é a <b>Mumbuca (M)</b>. Seu sonho: transformar este <b>mercadinho de bairro</b> em uma <b>rede de supermercados</b>.</p>
    <p><b>Arraste</b> o cenário para explorar e use <b>pinça</b> ou a <b>roda do mouse</b> para zoom. <b>Toque</b> em prateleiras, caixas, depósito, cestas e fachada para ver detalhes e melhorar.</p>
    <p>Mantenha as prateleiras cheias. No fim de cada dia você paga aluguel e salários. Volte todo dia: há <b>tarefas diárias</b> e a loja continua rendendo enquanto você está fora.</p>
    <button class="btn" id="go">${first ? "Abrir as portas" : "Entendi"}</button>`);
  document.getElementById("go").onclick = () => { hideModal(); save(); };
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) save();
  else { last = performance.now(); const o = offlineProgress(); if (o && o.days > 0) welcomeBack(o); save(); }
});
iniciarCarreira();
relayout(); fitCanvas(); measureHudBox(); syncWorkers(); resetGear(); ensureTasks(); hud();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureHudBox(); });
if (MODO === "menu") { paused = true; mostrarMenu(); }
else {
  const away = S.seenIntro && !introFasePendente && !lojaReaberta ? offlineProgress() : null;
  const troca = NA_CARREIRA ? lerTroca() : null;
